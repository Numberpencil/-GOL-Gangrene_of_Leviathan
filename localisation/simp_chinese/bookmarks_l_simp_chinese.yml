 GER_GATHERING_STORM_DESC:0 "我是说的道理"
 Black_Gold_Sand_Sea_NAME:0 "黑金沙海"
 Black_Gold_Sand_Sea_DESC:0 "阿拉伯，这片自古便饱经战火与动荡的土地，承载着无数苦难的记忆。进入二十世纪后，混乱更是变本加厉，仿佛永无止境。随着奥斯曼帝国在一战中轰然崩塌，英国的霸权也随之溃散，整个阿拉伯世界迅速坠入一种难以言喻的混沌深渊。\n在这片废墟之上，新的力量悄然崛起。昔兰尼加的塞努西教团借一战之机开始了大征服，先后吞并利比亚、突尼斯与埃及，建立起一个横跨北非的阿拉伯王国。与此同时，阿拉伯半岛上的沙特家族也完成了统一大业，将广袤的沙漠与圣城纳入麾下。而作为英国瓜分奥斯曼帝国的政治遗产，巴勒斯坦王国以一种极其尴尬的地缘姿态，孤悬于耶路撒冷，四周强敌环伺，内部矛盾丛生。\n如今，这座圣城之国正成为中东诸国角逐的焦点。宗教、资源、权力与历史的恩怨在此交织，巴勒斯坦的命运，注定将牵动整个阿拉伯世界的神经。"
 Crimson_Rift_NAME:0 "赤色裂隙"
 Crimson_Rift_DESC:0 "第一次世界大战为世界革命与民族独立带来了前所未有的契机。俄罗斯、法国、土耳其、意大利诸国相继爆发声势浩大的革命浪潮。尽管俄罗斯的革命最终被沙皇政府残酷镇压，革命的火焰却仍在在俄勒冈与土耳其熊熊燃烧——土耳其革命的胜利更引发了一场席卷近东的大革命风暴。\n然而，当下的世界革命局势难言乐观。俄罗斯的布尔什维克残部龟缩高加索一隅，时刻警惕着沙皇的反扑；列宁领导的俄勒冈红色政权与佛朗哥领导的巴拉圭合众国在重重围堵中艰难求生；而新生的土耳其革命政权，则面临着阿拉伯王国、希腊王国与俄罗斯等多方的联合绞杀。革命的曙光虽已照亮大地，但乌云仍未散去。"
 Darkened_Days_Over_Asia_Pacific_NAME:0 "亚太黯日"
 Darkened_Days_Over_Asia_Pacific_DESC:0 "日本，这个远东的新兴之国，以其惊人的崛起速度令世界侧目。自日清战争中一举击败腐朽的清帝国，再到日俄战争中以弱胜强、击溃沙俄太平洋舰队，日本成功跻身列强行列，成为亚洲唯一能与西方抗衡的力量。真正的腾飞始于第一次世界大战。趁欧洲列强无暇东顾之际，日本挥师南下，以雷霆之势征服印度支那与马来亚，将南洋的富饶土地尽收囊中，实现了称霸南洋的野心\n大战的东风不仅带来了领土的扩张，更催生了经济的奇迹。工厂日夜轰鸣，钢铁产量与经济连年翻番，商船队遍布太平洋的每一条航线。高楼拔地而起，帝国的触角伸向每一个新征服的市场。短短十余年间，日本从一个区域性强国蜕变为足以撼动全球格局的亚太霸主\n社会矛盾日益尖锐，政府的权力斗争从未停歇。尽管如此，如今的日本依然以无可撼动的亚太霸主姿态，不断向其西边的庞大邻国施加压力——铁路、港口、租界，每一步都在蚕食着那片古老大陆的尊严，而中国尽管深陷分裂之痛但仍然试图重新实现国家的再统一与民主的救亡图存。与此同时，帝国也时刻警惕着南方那道名为“远东协定”的武装中立防线，捍卫着东南亚的霸权。"
 Golden_Testament_NAME:0 "黄金遗嘱"
 Golden_Testament_DESC:0 "从拿破仑战争的废墟中崛起，西班牙帝国在伊莎贝拉时代迎来真正的黄金岁月。1820年起义迫使斐迪南七世让步，温和结束卡洛斯战争后，自由派内阁推行全面改革，重塑西班牙为现代化强权。干涉墨西哥为波旁王朝赢得新皇冠，并以平等姿态实现两国再联；在意大利成功夺取那不勒斯王位，一个横跨地中海两岸的帝国就此成型。\n在一战中选择加入同盟国，西班牙不仅分得胜利果实，还巩固了在北非和拉丁美洲的势力。然而战后殖民地独立战争频发，国内社会矛盾激化，帝国韧性面临考验。面对美利坚联盟国西扩、法俄复仇暗流，以及1929年“第二次大恐慌”的经济冲击，西班牙不得不在荣耀与危机间艰难平衡——它既是旧秩序守护者，也是新时代浪潮中的挣扎者，在地中海与大西洋之间续写自己的传奇。"
 Sunset_of_Bygone_Days_NAME:0 "旧日残阳"
 Sunset_of_Bygone_Days_DESC:0 "上一次大战中，法兰西与俄罗斯帝国相继被德意志帝国一一击碎。巴黎沦陷的耻辱、马恩河畔的血色黄昏、东线百万大军的溃败——自1870年色当战役以来的一切挣扎，终化为徒劳。法俄再度沦为被欧洲抛弃的弱者，蜷缩在大陆权力的边缘，昔日的荣光消散。巴尔干各国同样因大战的战败而损失惨重，塞尔维亚的皮埃蒙特之梦为之粉碎，罗马尼亚承受着分裂之痛，保加利亚亦承受着无尽的屈辱。\n俄罗斯深陷革命的泥潭。布尔什维克的赤旗虽已被沙皇的铁蹄暂时踏碎，但高加索的山谷间仍藏着革命的种子。沙皇稳固了统治，并在此后以俄罗斯的庞大资源以未受损的工业重新开启了俄罗斯未竞的现代化。\n法国则转向军政府的铁腕统治。共和国的理想被刺刀取代，三色旗依然飘扬，但自由、平等、博爱的信念已在堑壕的泥泞中窒息。军靴声回荡在巴黎的林荫大道上。\n然而，如今这些重整旗鼓的战败者，正默默磨砺着复仇的利刃。他们等待着那个时刻——当德意志帝国的锋芒出现一丝裂痕，当复仇的号角再次吹响，他们将向昔日的践踏者讨还一切血债。"
 Unfinished_Utopia_NAME:0 "未竟新乡"
 Unfinished_Utopia_DESC:0 "合众国输掉那场大战后，二十年代的狂热尚未冷却，大萧条便席卷一切。林德伯格趁势掌管政权，合众国的自由民主与多党制被专制主义所取代。而南方的联盟国内部千疮百孔。工业设备老旧不堪，资本严重匮乏，北方托拉斯企业如藤蔓般侵入每一寸经济血脉。矿山，铁路，港口一切尽归他者，如僵尸一般苟活。\n西部则在各州脱离联邦后陷入混战，最终加利福尼亚、俄勒冈、内华达勉强存世。俄勒冈在二十年代经历一场革命，换了面貌。其余疆土沦为军阀猎场，今日此人插旗，明日彼人易帜，枪声代替钟声回荡在荒原之上。残墙断壁之间，无人记得昨日旗帜的颜色，也无人敢断言明晨太阳为谁升起。"
 Winds_of_Rebirth_NAME:0 "往日之影"
 Winds_of_Rebirth_DESC:0 "第一次世界大战是不列颠命运的转折点。德意志的最终胜利，酿成了帝国史上最惨痛的灾难。1919年之战败后，加拿大、澳大利亚、新西兰相继获得完全自治，印度被迫承诺十年内实现自治，爱尔兰则在德美调停下以自由邦的形式脱离联合王国。曾经日不落的大英帝国，一夜之间退回英伦三岛。\n战后的英国陷入漫长萧条。“世界工厂”沦为难以与德美竞争的疲弱工业国，伦敦金融城的辉煌被纽约和柏林取而代之。为维系最后的体面，英国收缩全球战线，将战略重心转向英联邦诸国，试图重建一个缩水版帝国。而1930年代的经济大萧条则再次重创了这个疲惫的老牌强国，让帝国处在了变革的十字路口。\n如今的英国，正试图推动法俄英之间的再联合，以制衡德意志帝国日益膨胀的霸权的同时，也不得不直面国内积弊已久的种种难题。帝国的背影虽已远去，但生存的斗争从未停止。"
 COUNTRY_SELECTION_CHARACTER_DESC:0 "$NAME|Y$$DESC|$\n$TRAITS_DESC|$"
 Gangrene_of_Leviathan_FRA_DESC:0 "世界大战的惨败让无数法国人为之懊恼，而在战败之后紧接而来的就是严峻的社会问题并逐渐演变成了全国范围内的革命。尽管最终被军方付出极大代价镇压但也进一步割裂了全法国。\n在军方镇压革命之后便迅速肃清了法国政局建立了法兰西临时国防政府，其统治一直延续到今日。在军政府时期，法国的国力有所恢复，但随着时间的推进，越来越多法国人希望结束军政府统治，重新向民主过渡。\n军政府如今正承受着巨大的压力，而大统领德斯佩雷身体情况的逐渐恶化似乎正暗示着民主化过渡已经不可避免。而随着拉加代尔的法兰西工团行动党在法国的迅速崛起以及他与军方的暖昧关系，让无数人认为他就是军政府的统治可能结束后的全国大选的有力竟争。"
 Golden_Testament_SPR_DESC: "西班牙王国尽管遭遇挫折，但如今仍然是世界的主要国家之一。\n大战的中立为西班牙王国带来了丰厚的利润，但是大战的红利之下也埋藏着无数危机。在这段时期内王国内部的政治弊端愈发明显，劳工冲突进一步激化等。这一切都深深撕裂着这个历经艰辛才成功民主化的国家。而如今，内部的动荡，殖民地的反抗，欧洲秩序的崩坏正让整个帝国处于一个极度严峻的地步。\n对西班牙王国来说，改革弊端与清扫阻碍已经刻不容缓。"
