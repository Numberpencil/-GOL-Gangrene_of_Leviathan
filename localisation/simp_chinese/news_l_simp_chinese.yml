l_simp_chinese:
 news.1000.t:0 "匈牙利国王卡洛伊四世遇刺身亡"
 news.1000.d:0 "在布达佩斯一场旨在展示王国团结与稳定的公开演讲，最终以悲剧和混乱收场。匈牙利国王卡洛伊四世在多瑙河畔的议会广场向民众发表讲话时，遭到一名瓦拉几亚极端民族主义者的枪击，经抢救无效后宣告不治。\n  据现场目击者称，凶手混入人群，在国王演讲至高潮时突然发难，高呼“为了瓦拉几亚”后连开数枪。国王身中数弹，当场倒地，安保人员随后将凶手击毙。此次事件在布达佩斯弓|发了巨大震惊和悲痛，随后而来的则是针对瓦拉几亚裔居民的愤怒与骚乱。\n  有分析家认为这可能会导致新的战火，而这场战火无疑将决定巴尔干的未来"
 news.1000.a:0 "真野蛮"
 news.1001.t:0 "匈牙利王国新王奥托加冕圣斯蒂芬王冠"
 news.1001.d:0 "在举国哀悼与复仇的呼声中，已故卡尔四世之子、年轻的奥托·冯·哈布斯堡于圣马蒂亚斯教堂正式加冕为匈牙利国王，尊号奥托一世。加冕仪式庄严肃穆，那顶象征着匈牙利王权的圣斯蒂芬王冠被戴在了新王头上，标志着哈布斯堡王朝在一个充满不确定性的时代开启了新的篇章。 \n在随后发表的全国讲话中，奥托一世面色凝重，语气坚定，彻底摒弃了其父试图推行的调和政策。他郑重宣告：“以圣斯蒂芬之名，以我流消的血液，我发誓，我所继承的王冠之耻辱，必将以血洗清。瓦拉几亚将为其庇护的恐怖与背叛，付出相应的、彻底的代价。”这一强硬表态引发了匈牙利议会广场上山呼海啸般的支持声浪。"
 news.1001.a:0 "来真的?"
 news.1002.t:0 "布达佩斯通牒"
 news.1002.d:0 "在匈牙利最后通牒式的压力下，瓦拉几亚自治政府今日宣布全面接受布达佩斯提出的所有条件，以示“彻底臣服”。\n匈牙利国王奥托一世政府获得了对瓦拉几亚国防、财政及内部安全的全面干涉。布加勤斯特的现任政府在一片屈辱中被迫同意了这一安排，以换取匈牙利的“宽恕”。\n此间观察家认为，这种彻底的屈服无异于政治自杀，极大地动摇了现政府的合法性，恐将为更极端的民族主义势力铺平道路。"
 news.1002.a:0 "无药可救，难道他们忘了1914吗?"
 news.1003.t:0 "巴尔干爆发战争"
 news.1003.d:0 "今日午时，匈牙利王国政府正式向瓦拉几亚铁卫团政权递交宣战书，指控其“背信弃义、煽动恐怖主义并破坏地区稳定”。奥托一世国王在议会宣布：“瓦拉几亚的叛乱政权必须被彻底铲除，圣斯蒂芬王冠的尊严不容挑衅！”\n匈牙利陆军多个师已越过特兰西瓦尼亚山区，向布加勒斯特方向推进。此次军事行动被布达佩斯称为“惩戒行动”。\n面对匈牙利攻势，塞尔维亚与保加利亚和瓦拉几亚宣布展行此前在贝尔格莱德签署《巴尔干共同防御条约》，宣布“以一切必要手段支援瓦拉几亚”，并对匈牙利宣战。三国联军计划从南部战线夹击匈牙利军队，试图解围布加勒斯特。"
 news.1003.a:0 "我早就说这群混蛋会再次搞砸这一切"
 news.1004.t:0 "拉加代尔赢得法国大选"
 news.1004.d:0 "投票在一种异样的平静中结束。当最后一处投票站关闭，整个法国仿佛屏住了呼吸。\n最初的趋势让法国社会党人略感宽慰——他们在城市工业区保持了优势。然而，随着基础乡村和小城镇的选票如潮水般涌入，天平开始了缓慢而不可逆转的倾斜。工团行动党的旗帜，不仅飘扬在郊区的工厂外，更是插遍了中部沉寂的村庄和东部饱经战火的土地。拉加代尔的主张：“一个劳动者的法兰西”，一种既唾弃国际金融又拒绝国际革命的、强悍的法兰西本位主义像野火一样，点燃了那些既被旧资产者忽视、又被传统左翼遗忘的人。黎明时分，结果已无悬念。在全国巴黎，工团行动党的总部爆发出海啸般的欢呼，像是宣告一般，拉加代尔领导的党派赢得了压倒性多数的议席。支持者们举着“劳动、家庭、祖国”和“法兰西工团万岁”的标语，涌向街头，秩序井然却气势磅礴。与之相对的，是社会党总部门前的死寂，以及激进党等老派势力茫然无措的面孔……" 
 news.1004.a:0 "天哪，又一个革命分子?"
 news.1004.b:0 "这是法国人民的选择"
 news.1005.t:0 "改进型巨构机首次投入巴尔干战场"
 news.1005.d:0 "贝尔格莱德陷落之际，现代战争的形态被彻底改写。匈牙利军方投入数台购自德国克虏伯的旧型号巨构机，仅七天便碾碎了曾僵持良久的塞军全部防线。\n这股迅猛的攻势展现的并非单纯的火力，而是绝对的暴力碾压。六万军民化作齑粉，整座城市在履带下被夷为平地，地标建筑荡然无存。相较于欧战的奥匈贝尔格莱德的非人道占领，此次攻击不仅是物理意义上的摧毁，更是一种非人性的钢铁般的绝对灭绝。\n曾被嘲讽为“过时铁罐头”的巨构机，战后匈牙利军方披露的数据则狠狠扇肿了军事专家的嘴巴。贝尔格莱德的废墟无声地宣告：在这个“巨构时代”，凡人的血肉之躯，不过是待收割的草芥，一切轻武器的抵抗似乎都是徒劳的，这是一种比陆行舰更加骇人的军事武器，对巨构机的恐惧仿佛将再度笼罩于世界。"
 news.1005.a:0 "天哪"
 news.1006.t:0 "贝尔格莱德的陷落"
 news.1006.d:0 "昨夜，匈牙利王家陆军自伏伊伏丁那方向突破萨瓦河防线后攻入贝尔格莱德，南斯拉夫守军于凌晨放弃城区。据前线消息，国王及内阁已乘专列撤往尼什，行前下令炸毁多瑙河与萨瓦河上的主要桥梁以阻滞追兵。匈军由泽蒙切入，沿米哈伊洛大公街直插市中心，拂晓时分已控制卡莱梅格丹要塞与旧王宫——这座‘白色之城’自中世纪以来第四十余次易手。城中电力已经中断，要塞周边可见近卫军残部与匈军步兵交火的痕迹，萨瓦河口停泊的几艘塞军炮艇已自行凿沉。"
 news.1006.a:0 "大战的重演？"
 news.1007.t:0 "德国收到巨构机巴尔干战报"
 news.1007.d:0 "据可靠消息来源，德意志帝国已从巴尔干前线收到了关于改进型巨构机实战表现的详细战报。匈牙利军队在贝尔格莱德战役中投入的巨构机取得了惊人的战果，仅用一周便突破了此前僵持数月的防线。\n分析人士指出，这些来自真实战场的第一手数据对德国陆军未来的巨构机研发计划具有重大意义。有军事评论员称：“贝尔格莱德的废墟不仅埋葬了塞尔维亚的抵抗，也埋葬了所有对巨构机实战价值的质疑。”"
 news.1007.a:0 "令人印象深刻"
 news.1008.t:0 "巴尔干同盟取得胜利"
 news.1008.d:0 "自多瑙战争以来，纵使压在巴尔干头上的大山奥匈帝国业已崩溃，但是继承了奥匈遗产的匈牙利王国则在德国的支持下重新镇压了多瑙的民族浪潮，巴尔干的国家不得不重新屈从于哈布斯堡王朝的威压。\n但随着瓦拉几亚问题的逐渐升级，以保加利亚塞尔维亚为首的国家掀起了反抗匈牙利霸权的斗争，并最终在经过艰苦卓绝的战争后最终以占领布达佩斯为结局结束且取得了这场战争的胜利。\n如今巴尔干已经彻底掀翻了哈布斯堡的统治，但同盟的未来何去何从世界仍未知"
 news.1008.a:0 "布达佩斯的耻辱战败"
 news.1009.t:0 "匈牙利之胜"
 news.1009.d:0 "自布加勒斯特陷落以来，匈牙利王家陆军沿多瑙河两岸南下西进，先后在铁门峡谷击溃塞军主力、于克拉约瓦一线迫退瓦拉几亚近卫师。塞方代表乘悬挂白旗的卡车自尼什驶抵匈军第3集团军司令部，保方与瓦拉几亚随后亦照会布达佩斯“愿就停战条件磋商”。至此，“巴尔干三国同盟”宣告瓦解——瓦拉几亚早失都城，塞尔维亚则丧失了多瑙战争取得的一切领土，保加利亚则再次成为了屈辱的战败者。国王奥托向广场人群宣读捷报，称“波斯尼亚归怀、瓦拉几亚臣服，乃匈牙利之雪耻”。城中钟声长鸣，安德拉什大街挤满挥旗民众。\n柏林方面打破沉默，威廉大街发表通告“祝贺盟友恢复秩序”，并暗示将派特使赴布达佩斯“协调中东欧新格局”。意大利外交部对“匈牙利军队的胜利”表示密切关切，巴黎与莫斯科则哀叹巴尔干同盟体系一夜崩盘。"
 news.1009.a:0 "历史将被改写"
 news.1009.b:0 "糟透了"
 news.1009.c:0 "巴尔干战略的一次大胜利"
 news.1009.e:0 "再无阻挡匈牙利之可能"
 news.1010.t:0 "布达佩斯的陷落"
 news.1010.d:0 "昨日傍晚，塞尔维亚、保加利亚与瓦拉几亚三国联军攻入布达佩斯，结束了匈牙利军队在多瑙河一线的抵抗。据各方消息，匈牙利国王奥托一世及其内阁已于午后乘专列前往奥地利，行前下令销毁部分政府文件。联军部队从东南两个方向进入市区，其中塞尔维亚军队已沿安德拉什大街推进，至晚间已控制多瑙河上所有桥梁。市中心英雄广场附近曾发生短暂交火，随后被联军肃清。目前城中仍有零星枪声，电网与供水系统遭到破坏，部分地区出现火灾。\n国际社会对事态发展保持密切关注。德意志帝国迄今未采取军事行动，其外交部仅表示正在评估局势。奥地利已临时关闭部分边境口岸，据估计过去两天内约有十二万平民涌入奥地利境内。布达佩斯的陷落使中欧力量格局发生重大变化，特兰西瓦尼亚地区的归属问题再度成为焦点。各国驻布达佩斯使馆正安排侨民撤离，尚无关于大规模平民伤亡的确切报告。"
 news.1010.a:0 "耻辱"
 news.1010.b:0 "玩火自焚"
 news.1011.t:0 "布加勒斯特的陷落"
 news.1011.d:0 "自巴尔干战争开战以来匈牙利军队便与瓦拉几亚国防军激烈鏖战，而在经过鏖战之后瓦拉几亚在特兰西瓦尼亚组建的防线在匈牙利军队的迅猛攻势下被撕裂，匈牙利军队如潮水般涌入蒙特尼亚平原，瓦拉几亚已经陷入危难之中。\n布加勒斯特这座瓦拉几亚的中枢与核心之城正遭受着空前的威胁，而尽管瓦拉几亚军队组织了前沿阵地以及调遣了第三步兵师回防布加勒斯特但一切仍然为时已晚，仓促的防御在匈牙利军队的猛攻下崩溃，最终在内阁以国王撤离以后宣布布加勒斯特设为不设防城市，并被匈牙利占领。\n布加勒斯特的陷落无疑对于巴尔干同盟来说是一记重击，现在他们不得不面对布加勒斯特陷落以后带来的无数麻烦"
 news.1011.a:0 "巴尔干同盟破碎的开始"
 news.1012.t:0 "法国重建民主"
 news.1012.d:0 "法国的政治危机近日出现了戏剧性转折，拉加代尔今晨宣布辞职，并呼吁通过大选将权力移交给人民阵线，以避免军方全面接管国家\n九时整，发言人宣读了一份简短声明。拉加代尔在声明中承认，持续长久的罢工浪潮和街头冲突已“超出文官政府的控制能力”。“为避免军队介入造成更大伤亡，”他说，“我选择辞职，并推荐由布鲁姆组建过渡政府。”\n人民阵线领袖莱昂·布鲁姆接受记者采访时表示：“我们接受这一责任。法国的出路不在坦克轮下，而在投票箱前。”他呼吁各派保持克制，确保选举如期举行。\n福煦元帅方面保持沉默。总参谋部下午发布一份简短的书面回应，称“军队尊重宪政程序，暂不采取行动”\n英国外交部表示“谨慎欢迎和平过渡”，德国方面则未作正式评论。"
 news.1012.a:0 "民主的胜利"
 news.1013.t:0 "法国爆发军事政变"
 news.1013.d:0 "斐迪南.福熙元帅今日凌晨以临时总统身份接管政权，宣布全国进入戒严状态。前任总理拉加代尔在荣军院被召见后签署辞职书，随后在装甲车“护送”下前往枫丹白露宫，\n凌晨四时，坦克驶入协和广场，步兵接管了爱丽舍宫，内政部及各大报社，福熙总统签署第1号戒严令，规定巴黎，里昂，马赛进入军管状态。宵禁期间，格杀勿论，军事法庭对煽动者具有即决裁判权，贝尔维尔社员墙前传出排枪声，六名工团骨干被处决。里昂市政厅被夺回，数百名占领工人被押往军营，马赛港区的交火，导致了至少11人死亡。军事法庭在卡车上就地审判每起案件的审判时长不足三分钟，\n人民阵线核心领袖布鲁姆在住所遭囚禁，英国方面对此表示密切关注，德国对此表示祝贺，美国方面则不予置评，\n巴黎街头寂静如此，一名老妇对记者说，上次这么安静，是1920年"
 news.1013.a:0 "多么可笑的“民主”"


