 Constitutionalist:0 "宪政主义"
 Constitutionalist_desc:0 "宪政主义仍是自由主义思潮下的一大旗手，尽管其信仰者崇尚自由与民主，但认为自由和民主的前提是传统秩序的定锚，他们热爱自由的神话，但是却对大众民主怀有深深的不信任，人性的本恶与有限的认知终会演变为多数人对少数人的暴政，因此，深深嵌入人类社会结构的共识成为了保障民主制度的良药。程序、法律是神圣的约束，用于禁锢民主体制中诞生的猛兽。"
 Authoritarian_democrat:0 "威权民主主义"
 Authoritarian_democrat_desc:0 "威权民主主义"
 Hybrid_regime:0 "无支配体制"
 Hybrid_regime_desc:0 "无支配体制，通常也被称为混合政体，是一种同时结合了民主和专制元素的政府形式。虽然无支配体制通常允许某种形式的（尽管只占一半）的民主，如选举存在，但无支配体制的政权往往拥有一些被认为是非民主甚至专制的法律。虽然不一定像纯粹的专制政权那样充斥着腐败和压迫，但它们仍然容易做出与专制政权相同的极端行为。"
