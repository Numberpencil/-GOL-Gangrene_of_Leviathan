 Constitutional_monarchy:0 "立宪君主制"
 Constitutional_monarchy_desc:0 "君主立宪制，又称有限君主制、议会君主制或民主君主制，是君主制与宪政民主相结合的一种政治体制。在这种制度下，君主的存在和权力由宪法明确规定，君主依法行使职权，而不能像绝对君主制那样独自决策、独揽大权。宪法是国家治理的最高规范，君主的权力必须在法律框架内运行，因此这种体制既有君主制的外壳，又有宪政的内核。\n在君主立宪制国家中，君主通常不掌握实际行政权力，而是扮演国家统一象征和礼仪性元首的角色。政府的实际运作由议会和内阁负责，议会拥有立法权，内阁对议会负责，形成责任政府。君主在形式上可能仍拥有任命首相、签署法律等权力，但这些权力往往只是程序性仪式，必须依据宪法和法律以及民选政府的建议行使，不得任意使用。\n君主立宪制强调以宪法约束权力，保障公民权利和法治秩序，避免了绝对君主制下个人意志凌驾于国家法律的风险。它既保留了历史连续性，又通过宪法框架容纳了民主原则，是现代国家治理中一种稳定而灵活的意识形态制度安排。\n§Y稳定度§!§G+2.5%§!\n§Y每日政治点获取§!§G+1.5%§!"
 Bicameral_constitutional_monarchy:0 "二元君主立宪"
 Bicameral_constitutional_monarchy_desc:0 "二元君主立宪制是一种介于绝对君主制与议会君主制之间的政体形式。在这种体制下，宪法虽然同时确认了君主和议会并存的权力结构，但君主依然是国家政治生活中的实际权力中心，掌握着行政、军事和外交等核心事务的主导权。\n与议会君主制中君主虚位、政府向议会负责不同，二元君主立宪制下的政府通常由君主直接任命，政府对君主负责，而不是对议会负责。议会虽然拥有立法权，但这种权力往往受到严格限制，君主可以解散议会、否决议会通过的法律，甚至在不召开议会的情况下颁布具有法律效力的紧急法令。这种“君权与议会权力并行、但君权占据主导”的权力格局，正是“二元”之名的由来。\n二元君主立宪制能够在保持政治稳定的前提下引入一定程度的代议制机制，但整体民主化程度有限，国家重大决策仍高度依赖君主的个人权威与意志。\n§Y党派支持度对稳定度修正§!§G+10%§!\n§Y政治点数§!§G+2.5%§!"
 Tribal_system: "部落制"
 Tribal_system_desc: "在部落制下，权力结构往往不具有现代国家那种高度集中的科层制形态。部落首领通常由世袭或由部落内部德高望重的长老推举产生，其权力依赖成员的承认与传统权威的支撑，而非成文宪法或官僚机器的授予。重大事务如战争、迁徙、资源分配和对外交往，往往通过部落会议或长老协商等方式共同决定，体现出一种集体协商与氏族民主并存的治理特征。\n§Y战争支持度§!§G+2.5%§!\n§Y每日政治点数获取§!§R-3.5%§!"
 Dictatorship: "独裁制"
 Dictatorship_desc: "独裁制，是一种权力高度集中于个人、少数集团或单一政党的政治统治形式。在这种体制下，统治者通常不受宪法和法律的实质约束，也不需要对民众或民选机构负责，国家重大决策主要依据统治者的个人意志，而非制度化的公共程序。独裁制往往通过军队、警察等暴力机器维持统治，严格限制言论、出版和集会自由，议会与法院等机构即便存在，也常常沦为形式化的橡皮图章。\n独裁制的核心特征在于权力的专断性与绝对性。权力交接缺乏透明规则，多依赖武力、权术或家族世袭，政治生活高度依赖领袖个人，常伴随个人崇拜和舆论控制。§Y稳定度§!§R-2.5%§!\n§Y生活消费品系数§!§G-1.5%§!\n§Y顾问花费§!§G-5%§!"
 Oligarchic_government: "寡头政府"
 Oligarchic_government_desc: "寡头政府，是一种由少数人或少数集团垄断政治权力的治理形式。这里的“少数人”并非通过广泛选举产生，而是凭借财富、出身、军权、宗教地位或政治派系等资源掌控国家决策，普通民众在权力分配中被边缘化，选举与议会等民主程序即便存在，也往往被寡头集团操纵或架空。\n寡头制的核心特征在于权力的排他性与利益的高度私有化。少数统治者的决策主要以维护自身阶层利益为导向，公共政策常成为利益输送的工具，导致严重的贫富分化与阶层固化。权力交接通常局限于精英圈子内部，缺乏面向社会的开放性竞争，与以制度化和大众参与为基础的现代民主体制形成鲜明对照。在历史上，寡头制既见于古希腊斯巴达的贵族会议、中世纪意大利城邦的金融贵族政权，也以不同形式潜伏于当代某些国家的大财阀与政治家族联合掌控政局的现象之中。\n寡头政府往往能维持表面的政治稳定，但其代价是公共责任的缺失与监督机制的失灵。由于缺乏有效的权力制衡，腐败、裙带关系和权钱交易容易成为常态，社会矛盾随之积累，长远来看无疑将会动摇社会稳定与冲击政府。\n§Y每日政治点获取§!§R-0.5%§!\n§Y生活消费品系数§!§R+2.5%§!\建造速度!§G+1.5%§!"
 Military_government_system: "军政府制度"
 Military_government_system_desc: "军政府普遍缺乏成熟系统的意识形态，多以实用主义、民族主义和发展主义为主轴。它往往以“维护国家安定”“铲除腐败”“拯救国家于危难”为旗号，将自己塑造成超越党派利益的中立仲裁者，以此解释夺权正当性。在治理理念上，军政府强调整体稳定与效率优先，主张“先发展、后民主”，将政治权利和制度程序视为经济建设的干扰物。因此，军政府的政治纲领本质上是一种以“主权在军”为基础的威权发展主义：用秩序和发展政绩来换取统治合法性，同时拒绝开放自由竞争和代议制问责。一旦秩序承诺失效、发展分配不公，这种纲领便迅速暴露其虚妄，政权合法性也随之瓦解。§Y稳定度§!§R-5%§!\n§Y工厂产出§!§G+1.5%§!\n§Y陆军经验增长§!§G+2.5%§!"
 Absolute_monarchy: "绝对君主制"
 Absolute_monarchy_desc: "君主专制，是一种君主拥有国家最高绝对权力的政体形式。君主不受宪法、法律或民选机构的约束，其个人意志即被视为国家最高法律，权力来源通常依托君权神授、天命论或世代沿袭的传统合法性。\n绝对君主制将君主塑造为国家的人格化象征，宣称君主权力直接来自神明或神圣秩序，因而神圣不可侵犯、不可挑战。忠诚于君主等同于忠诚于国家，反对君主即是叛国。这种意识形态高度强化个人权威，以传统、宗教和等级观念作为统治合法性基础，压制平等、自由和契约思想，从根源上排斥分权制衡与人民主权观念。\n绝对君主制以权力集中和国家统一为核心目标，强调秩序先于自由、稳定先于参与。统治者往往以“国家理性”和“公共利益”为旗号，推行自上而下的改革或保守政策，通过统一法律、强化官僚体系和掌控军队来巩固中央权威。在经济领域，常奉行重商主义或国家主导的发展策略，将国家财富和军事扩张视为君主荣耀的延伸，同时严密控制教育、舆论和宗教，以维护思想统一。\n§Y核心领土防御§!§G+2.5%§!\n§Y战争支持度§!§G+2.5%§!"
 federal_republic: "联邦共和制"
 federal_republic_desc: "联邦共和制是联邦制与共和制相结合的国家结构形式，它既保留了地方自治的传统，又确立了人民主权的宪政基础。与单一制国家不同，联邦共和制由多个成员州或邦组成，联邦政府与各州政府均在宪法的框架内享有各自的权力，并在全国范围内实行民主选举与代议治理。\n联邦共和制的核心是人民主权与有限政府。国家权力被认为来源于人民，政府的合法性必须通过定期选举、宪政程序和公众参与来体现，而非依靠君主个人或军事权威。联邦主义的意识形态强调统一性与多样性的共存，主张不同地区可以拥有独特的法律与文化传统，但与此同时，各州必须在国家统一的大框架下协调运作。这种观念在根本上反对权力的人格化与世袭化，认为政治权力应当受到宪法和法律的理性约束。\n联邦共和制在理念上否认个人或集团对权力的垄断，在制度上通过宪法、选举和司法审查保障政权的开放与稳定。它尝试将规模大国与多元社会纳入统一的法律秩序，并以程序理性和人民授权来调和自由与秩序之间的张力。\n§Y战争支持度§!§G+2.5%§!\n§Y稳定度§!§G+2.5%§!"
 Theocracy: "神权政体"
 Theocracy_desc: "神权政体是一种将宗教权威与政治权力高度融合的国家治理形式。在这种政体下，国家最高权力的来源被归结于神或神的代表，宗教教义直接构成政治合法性的基础。统治者被认为代行神意，其权力不受世俗宪法或民选程序的约束，而受神圣经典和宗教法的规范。\n神权政体以宗教信仰为最高价值，主张政治秩序必须服从神圣秩序。它强调神的主权高于人民主权，认为人类的立法与治理都应当以上帝启示或神圣律法为最终依据。世俗主义、多元主义和理性主义被视为对信仰的侵蚀，因而被排斥或严格限制。这种意识形态将国家、民族与宗教共同体绑定，使政治身份与信仰身份高度重合，形成一种以“神圣使命”为内核的统治理念。\n神权政体通常由宗教领袖或祭司集团行使最高权力。法律体系以宗教法为核心，立法机构即使存在，也必须在宗教框架内运作，不得制定违背教义的世俗法律。司法权由宗教法庭掌控，法官依据神圣经典和历代法学解释进行裁判。行政系统依附于宗教等级结构，重要职位常由教士或宗教学者担任，国家的军事、财政和教育资源均被动员以维护宗教秩序。权力交接主要通过宗教内部的传承规则或协商机制完成，缺乏世俗化的程序竞争。\n§Y非核心领土攻防§!§G+5%§!\n§Y核心领土攻防§!§G+5%§!\n§Y稳定度§!§G+10%§!"
 parliamentary_republic: "议会共和制"
 parliamentary_republic_desc: "议会共和制，是一种以议会为国家权力核心、政府由议会多数派组建并对议会负责的共和政体形式。在这一体制下，国家虽然在法律上设有总统作为国家元首，但行政实权并不归属于总统，而是由议会产生的内阁（或部长会议）行使，因此有效地将国家元首的礼仪象征与行政首脑的实际决策分离开来。\n议会共和制的核心理念是人民主权与议会主权并重。它认为国家的政治合法性最终源自公民选举所表达的公共意志，而议会正是公意汇聚与表达的最高机构。议会制反对权力集中于单一个人或行政部门，强调政府必须建立在议会多数信任的基础上，且必须不断向议会负责。这种理念崇尚代议制民主、多党竞争、政治协商和法治原则，将政权正当性建立在程序正义和选举授权之上，而非血缘、信仰或军事力量。\n议会共和制注重回应社会多元诉求，政策导向通常表现为以社会福利、公共教育、经济调控、民生保障为核心的治理议程。由于政府需要通过议会多数支持才能推行法案，其政治纲领往往带有协商和妥协的色彩，促使政党之间在竞选后形成执政联盟或联合政府。政府既要推进自身施政理念，也不得不顾及议会内部不同政治力量和议会外社会群体的压力，因此这种体制下的政策更强调渐进的制度改良而非大刀阔斧的激进革命。\n§Y每日政治点获取§!§G+5%§!"
 Colonial_government: "殖民政府"
 colonial_government_desc: "殖民政府是指宗主国通过征服、占领或条约等方式，在殖民地建立起来的、以维护宗主国利益为核心目标的政治统治体制。它并不是基于被统治地区人民的同意而成立，而是外部强加的行政机构，其存在和运作的根本目的是将殖民地的土地、资源、劳动力和市场纳入宗主国的控制体系，服从于帝国的整体战略和经济利益。\n殖民政府通常以文明优越论和开化使命为合法性依据。殖民者往往把自己描绘成传播文明、宗教和先进制度的使者，将殖民统治解释为对“落后”地区的拯救与启蒙，并以此掩盖其背后的掠夺性质。这类意识形态带有强烈的种族主义色彩，将殖民地人民视为需要被驯化和教化的“他者”，否认其自主治理的能力，进而为宗主国垄断政治权力提供道德借口。\n殖民政府的核心目标是经济榨取和政治控制。它通过垄断贸易、征收赋税、强制种植单一经济作物、开发矿产资源和征用劳动力等方式，将殖民地经济结构扭曲为宗主国经济体的附属环节。同时，殖民政府严格压制殖民地人民的政治权利和民族自决诉求，禁止或限制其参与行政事务，通过文化同化或分而治之的策略瓦解本地社会的凝聚力，以便于维持统治秩序。\n§Y宗主国拥有军民工厂§!§G+30%§!\n§Y宗主国额外贸易成本§!§G-20%§!"
 Presidential_republic: "总统共和制"
 Presidential_republic_desc: "总统共和制，是一种以总统为国家权力核心的共和政体形式。在总统共和制下，总统既是国家元首又是政府首脑，直接领导行政部门，其权力来源于宪法和选民的直接或间接授权，而非议会信任。总统与议会分别经由不同的选举程序产生，各自独立行使权力，共同构成国家治理的二元核心。\n总统共和制的根基是人民主权与分权制衡。它主张行政权的合法性应当直接来自选民，而非立法机构的授权，因此总统在政治象征上代表国家统一和民意的集中表达。同时，这一体制否定任何个人或集团对权力的无限垄断，强调宪法至上，将行政、立法、司法分别授予不同机关，以防止权力集中走向专制。总统作为行政权的人格化象征，拥有相当的权威，但这种权威必须始终被置于宪法的约束之下，并接受定期选举和任期限制的检验。总统共和制以直接民选授权增强行政合法性，以固定任期保障政府稳定，以权力制衡维护宪政秩序。\n§Y稳定度§!§G+5%§!\n§Y意识形态漂移辩护§!§G+5%§!"
