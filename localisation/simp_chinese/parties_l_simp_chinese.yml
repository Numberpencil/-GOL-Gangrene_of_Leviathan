 Social_democratism:0 "社会民主主义"
 Social_democratism_desc:0 "社会民主主义起源于19世纪工业化浪潮中汹涌而起的工人运动。当机器的轰鸣取代了手工的节奏，当资本的积累以工人的血汗为燃料，当工厂成为规训与剥削的日常场所时，劳动者不再沉默。他们在罢工的火光里、在工会大厅的低语中、在街头游行的旗帜下，第一次集体地喊出了对正义的渴求。社会民主主义，就在这样的呼声中诞生。\n它继承了启蒙时期，社会主义思想对劳动者权益以及对社会公道的追崇，但是与革命形式的左翼派别不同，它在资本主义发展过程中见识到制度的自我完善与工人组织的变迁，它相信，真正的社会主义不是一夜之间砸碎旧世界，而是日复一日地重塑新秩序。\n尽管如今饱受批判与贬低，但它仍然作为巨人——耸立在政界中，为一代又一代的劳动者争取到了呼吸的空间、尊严的底线与未来的可能。"
 SPR_Social_democratism_desc:0 "PSOE（西班牙工人社会党）作为西班牙最早成立的§q社会主义政党§!，从一开始就代表了马德里，毕尔巴鄂等地的产业工人，§q而该党自一开始也致力于以马克思主义团结全西班牙的产业工人。§!作为一个社会主义政党PSOE自建立一开始便受到了政府的冷落和排挤，直到世纪初才成功于西班牙议会获得席位。当然这得意于UGT和PSOE的紧密关系，§qUGT（总工会）§!的规模壮大同样带动了PSOE的规模壮大。\n伴随着世界大战的爆发则同样给予了PSOE和UGT一个进一步壮大其规模的契机，PSOE也同样借世界大战大肆扩大了其影响力并且凭借对UGT的管控让政府不得不对其妥协退让使得PSOE在议会获得了更大的权势，§q直至大战结束的1919年PSOE已经是当时西班牙绝无仅有的社会主义大党。§!\n同样，由卡诺瓦斯构造的两党制度的崩溃也更给予了PSOE进一步扩大其政治影响力的机会，尽管在普利莫政变之后保守党和自由党便组建了PDC (立宪民主党)但是着仍然让PSOE尝到了不少的甜头。\n而伴随着第二次大恐慌的到来，社会形势经历了激进化和意识形态对抗的过程，§QPSOE也未能幸免§!。该党逐渐分裂为两派：一派是较为§q中间派和民主派§!，以§q因达莱西奥·普列托和胡利安·贝斯特罗§!为代表；另一派是较为§Q激进派§!，以§Q弗朗西斯科·拉戈·卡瓦列罗§!为首，后者日益倾向于§Q否定君主制体制，主张苏维埃式的无产阶级革命§!。而两者的斗争直至如今仍未结束，在即将迈入大选年的1935年政治观察家们一致认为PSOE内部路线的斗争同样将决定西班牙的政治路线抉择。"
