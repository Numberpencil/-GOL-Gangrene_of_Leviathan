 Spanish_Catholic_corporatism: "西班牙天主教社团主义"
 SPR_Spanish_Catholic_corporatism_desc: "PNE（西班牙民族复兴党）作为一个在二十年代崛起的新型政党，他继承了AP（人民行动党）的政治理念。其自身定位是§E“肯定和捍卫基督教文明的原则”§!，并将这种理论支持转化为修改宪法的实际诉求。PNE自视为一个“防御性”组织，§E旨在保护宗教、家庭和财产§!。\n该党领导人何塞·玛丽亚·吉尔-罗夫莱斯甚至声称，§E他的目的是“赋予西班牙真正的统一、一种新的精神和一种极权主义政策”§!，并补充说，§E“民主不是目的，而是征服新国家的手段。时机成熟时，无论是否通过议会，我们都会消灭它（民主）§!。”其纲领可以概括为§e“宗教、祖国、家庭、秩序、劳动和财产”§!。\nPNE认为应该以§E西班牙式天主教社团主义§!重塑整个西班牙，扭转西班牙自大战以来的颓废。并且以极度亢奋的语气抨击着犹太共济会对于西班牙歹毒的迫害。\nPNE成功团结了新兴的资产阶级子弟并且通过对天主教的捍卫支持成功获得了广大农民的支持，而最重要的则是他得到了以胡安·马奇为首的西班牙寡头的支持，而他的宗教色彩与其党内相当数量的神职人员更让其得到了西班牙教会的支持。更重要的则是路易斯·卢西亚提议的联邦法案更让洛夫莱斯成功了团结西班牙一系列的右翼政党。\n到了1935年PNE已经成为全国声势滔天的右翼最大党，以领袖自居的洛夫莱斯正注视着1936年的全国大选随时准备夺取首相之位和议会的优势席位并借此重塑整个西班牙。"
