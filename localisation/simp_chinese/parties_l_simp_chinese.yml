 Prussian_imperialism: "普鲁士帝国主义"
 Prussian_imperialism_desc: "普鲁士帝国主义与其说是一种新型意识形态不如说是普鲁士思想在现代的转型——皇帝是神圣与天意的代表，国王是宗法与民族意志的唯一者，它诞生于保守建制派对‘失败与民主化’的深重恐惧。为了对抗国会的和平决议，传统的容克贵族与军工巨头扯下了旧时代体面、审慎的精英面具，首次向现代大众民粹主义出卖了灵魂。"
