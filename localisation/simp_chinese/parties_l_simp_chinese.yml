 Anarchist_syndicalism_SPR:0 "无政府工团主义"
 Anarchist_syndicalism_SPR_desc:0 "1910年，§QCNT（全劳联）§!于巴塞罗那大会上成立，其初衷便是要与当时主导工会界的UGT（总工会）划清界限。但成立次年，它便因在美术大会后号召罢工，遭到巴塞罗那当局严厉镇压，被迫转入地下，从此开始了漫长的流亡与重组。直到一战爆发，西班牙卷入战事，巴塞罗那的工业危机为CNT提供了新土壤。§Q它趁势团结起对企业和政府不满的工人，组织规模迅速扩大，并于1916年底发动全国性罢工，公开向政府施压。§!\n然而1917年战局急转直下，巴塞罗那落入法国之手。CNT随即转向反抗法国占领，这一抵抗姿态反而让它赢得更多支持，势力进一步扩张。1919年协约国投降，巴塞罗那光复，CNT已成为加泰罗尼亚举足轻重的工会力量。§Q同年的拉科梅迪亚大会上，超过500名代表代表近百万成员出席，会议确立了无政府共产主义目标，并强调直接行动、拒绝一切仲裁、必要时使用破坏手段。§!\n但当局的打压并未停止，CNT在外压之下逐渐走向§q温和§!，开始与政府合作。这种路线转变引发内部争议，无政府主义派系与工团主义派系矛盾激化，§Q最终在1927年，FAI（伊比利亚无政府主义联盟）脱离CNT，§!工会发生重大分裂，§Q工团主义者自此占据上风。§!此后随着第二次大恐慌席卷西班牙，CNT再度在全国掀起劳工运动向政府施压，却在政府反制下被迫放弃进一步激进策略，转向更实际的劳资领域。到1935年，CNT依然是西班牙最大的工会组织之一，规模足以左右国内政治走向。"
