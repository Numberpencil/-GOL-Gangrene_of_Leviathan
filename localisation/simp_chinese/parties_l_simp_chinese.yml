 Accelerationist_nazim_desc:0 "大德意志赢得了一战，却失去了二战的胜利。德国人自问这是为什么？而加速主义便在这种绝望的处境中诞生。该派系在战时起初仅是技术官僚的私交，但在战败后，许多狂热的党员与知识精英追随起汉斯·卡姆勒，该派系迅速崛起成为了民社党的第一团体。现在，他们将为失去的胜利问罪，将为德国的失败复仇，将为民族的未来奋战......"
