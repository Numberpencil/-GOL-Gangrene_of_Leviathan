 Managed_democracy: "管理式民主"
 Managed_democracy_desc: "管理式民主是超级地球政权所实行的核心政治体制与官方意识形态。该体制融合了极端爱国主义、军国主义以及高度技术官僚化的威权主义特征，其核心理念是通过科学算法和计算机系统来“协助”公民完成民主选举，从而确保国家意志的高度统一和绝对高效， 尽管在形式上保留了选举和公民参与的躯壳，但实质上的统治权集中于超级地球的民主委员会及各类职能部门\n§R注意!该言论未经真理部审核！§!"
