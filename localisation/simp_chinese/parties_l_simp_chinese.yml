 Integralist_corporatism_Talulah:0 "整合运动-塔露拉思想"
 Integralist_corporatism_Talulah_desc:0 "整合运动是一个为底层感染者争取权益的革命组织，同时也是规模最大的感染者组织。整合运动宣称“感染者应该为自己的身份而骄傲，并用最简单的手段夺取世界的公正”，原本的整合运动只是一个普通的地下组织，直到塔露拉成为整合运动的领袖，整合运动开始进行有组织的革命行动。"
