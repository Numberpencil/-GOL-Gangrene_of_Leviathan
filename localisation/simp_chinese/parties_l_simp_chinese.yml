 Rhode_Island: "罗德岛-阿米娅派"
 Rhode_Island_desc: "阿米娅的政治与哲学思想是指罗德岛制药公司公开领袖阿米娅所持有的核心意识形态。其核心思想被广泛定义为带有强烈人道主义与社群主义色彩的、践行渐进式改革的理性理想主义。主张超国家与超阶级的“国际主义”并带有改良主义与反威权主义的特征，这使她的立场在激进革命派与保守威权派之间呈现出一种温和的中道主义特征。"
 #民
 democrat:0 "民主主义"
 democrat_noun:0 "民主主义"
 democrat_desc:0 "民主政体"
 Islamic_liberalism:0 "伊斯兰自由主义"
 Islamic_liberalism_desc:0 ""
 Liberalism:0 "自由主义"
 Liberalism_desc:0 "自由主义之含义与宗旨便在于其名：自由，对于自由的向往和渴盼嵌入进追随者的灵魂与本性中。它号称人人皆有自由意志，并通过暴力与革命的形式让公民从君主的私有财富中解放出来，“天赋人权”不是一种单纯的口号，而是古希腊“自治”与“公民美德”的现代性重演与颠覆。自由就这样伴随着时代与变革成为了人类文明史上不可撼动的理念。\n自由主义——标榜为推倒愚昧与黑暗的正义之军，就这样成为了保障经济自由、个人权利与私有财富、资本主义市场的政治-制度，并因美国在独立战争的辉煌战役而取得对全球的世界性胜利，从而开启了进步、平等的时代——自由主义便这样内嵌于人类历史的重要篇章中。"
 Christian_democratic:0 "基督民主主义"
 Christian_democratic_desc:0 "基督教民主主义源于19世纪欧洲天主教对工业化洪流与自由放任资本主义双重撕裂的回应。它拒绝让市场成为唯一的神，也拒绝让阶级仇恨成为唯一的正义。它相信，真正的社会秩序只能在基督徒的良知与教会训导的指引下重建。\n它将《圣经》中“爱邻如己”与“人的尊严”这些古老箴言，转化为可触摸的政治行动准则：它完成了对世俗政治的神学僭越——政治不再是赤裸的权力游戏，而应成为对人性尊严的守护与救赎。它拒绝极端个人主义，也拒绝全能国家主义；它主张辅助性原则——让最小的共同体（家庭、教会、合作社、地方自治体）承担最大可能的事务，只有在它们无力之时，国家才以谦卑的姿态介入。\n“行公义，好怜悯，存谦卑的心，与你的神同行”"
 Christian_democratic_Z:0 "基督民主主义"
 Christian_democratic_Z_desc:0 "基督教民主主义源于19世纪欧洲天主教对工业化洪流与自由放任资本主义双重撕裂的回应。它拒绝让市场成为唯一的神，也拒绝让阶级仇恨成为唯一的正义。它相信，真正的社会秩序只能在基督徒的良知与教会训导的指引下重建。\n它将《圣经》中“爱邻如己”与“人的尊严”这些古老箴言，转化为可触摸的政治行动准则：它完成了对世俗政治的神学僭越——政治不再是赤裸的权力游戏，而应成为对人性尊严的守护与救赎。它拒绝极端个人主义，也拒绝全能国家主义；它主张辅助性原则——让最小的共同体（家庭、教会、合作社、地方自治体）承担最大可能的事务，只有在它们无力之时，国家才以谦卑的姿态介入。\n“行公义，好怜悯，存谦卑的心，与你的神同行”"
 Oligarchist_liberalism:0 "寡头自由主义"
 Oligarchist_liberalism_desc:0 ""
 Social_monarchy:0 "社会君主制"
 Social_monarchy_desc:0 ""
 Conservativist_democrat:0 "保守民主主义"
 Conservativist_democrat_desc:0 "19世纪对于人民民主的恐惧成就了保守自由主义，他们拒绝狂热不现实的乌托邦的幻想，认定有财产、有教养的精英才可托付政治信任——大众是羔羊，容易被煽动家蛊惑从而走向极权与专政，那是对于民主制的僭越，也是自由民主的末路，唯有智识才能束缚浪潮。"
 Conservativist_democrat_PDC: "保守民主主义"
 Conservativist_democrat_PDC_desc: "PDC（立宪民主党）是如今西班牙议会的第一大党，§E他继承了保守党与自由党的政治遗产于大战结束后的1924年组建§!，因自由党领袖卡莱纳哈斯和保守党领袖安东尼奥·毛拉的相继去世作为西班牙议会两大党的自由党和保守党相继陷入§q分裂深渊§!，自由党分裂为保守的罗马诺内斯派和加西亚·普列托派。而保守党也在毛拉等政治强人去世之后陷入群龙无首的境地。\n而大战结束后长期的经济萧条和政治暴力更给整个西班牙的宪政制度蒙上了一层阴影，而两大党的相继陷入分裂既意味着以往的宪政制度陷入了崩坏更意味着如今的政党势力难以遏制全国性的暴乱与军队派系的蠢蠢欲动。\n§q伴随着1923年巴塞罗那军长普里莫以全国性动乱在获得了部分巴塞罗那寡头的支持后便悍然宣布进军马德里§!，但是普利莫糟糕的准备和全国的反对呼声最终让其计划失败，普利莫不得已仓皇逃离西班牙。但普利莫军变和PSOE（西班牙工人社会党）的崛起已经让自由党和保守党的各个派系感受到了§q前所未有的威胁§!，§E最终于1924年于马德里召开大会宣布了合并和组建PDC决定§!，尽管党内的磨合仍然需要很长的一段时间，但是这同样标志着西班牙的宪政制度正在重新走向正轨。\n而第二次大恐慌的到来则再次给予了宪政制度重击，在这种紧急情况下§E米格尔毛拉§!作为安东尼奥毛拉之子脱颖而出，其掌握的大量政治资源和其§E毛拉主义§!的口号让其很快吸引了PDC内部多数派的支持并最终让其理所当然成为了PDC的无可置疑领袖。但是如今的局势对其同样严峻，西班牙帝国在全世界各地的败退和大恐慌的余波以及左右派系的崛起注定让其试图维持宪政制度的尝试无比困难。"
 Radical_republicanism:0 "激进共和主义"
 Radical_republicanism_desc:0 ""
 Saint_Lof_Foundation: "司辰式庇护民主"
 Saint_Lof_Foundation_desc: "维尔汀的政治与哲学思想呈现出一种具有高度人本主义色彩的、倡导多元共生的存在主义经验论。极其尊重要素和个体的“存在本身”，强烈反对任何将个体工具化、数字化的宏大叙事。反对威权主义并建立在高度的经验主义之上。"
 
