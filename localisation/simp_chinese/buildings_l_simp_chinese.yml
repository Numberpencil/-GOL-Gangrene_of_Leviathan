 landmark_forbidden_city: "紫禁城"
 landmark_forbidden_city_plural: "$landmark_forbidden_city$"
 landmark_forbidden_city_desc: "紫禁城坐落于北京城中轴线上，始建于永乐四年，永乐十八年建成，至今五百余年。城墙朱红，琉璃瓦金黄，护城河碧绿环绕。九千余间殿宇沿南北中轴线依次铺展，太和殿踞于三层汉白玉台基之上，殿内金砖墁地，藻井蟠龙含珠，帝王御座居中高置。乾清宫、交泰殿、坤宁宫依次排列，东西六宫如众星拱月。\n这座城曾是天下最森严的所在。寻常百姓不得靠近半步，文武百官至此下马步行。皇帝在此早朝、祭天、批阅奏章、册立皇后，也在此度过漫长而孤独的日日夜夜。多少圣旨从这里发出，决定了万里之外的土地与千万人的命运；多少密谋在偏殿的烛光下完成，改变了王朝的走向。\n如今它已不再是皇宫。溥仪被逐出十年有余，宫门向寻常人敞开。太和殿前的广场空空荡荡，只有游客的脚步声与鸽子的咕鸣声回荡。龙椅被围栏隔开，供人远观。昔日天子起居之处，如今陈列着瓷器、书画与钟表，供人评头论足。\n紫禁城还是那座紫禁城。琉璃瓦依旧在日光下闪着金光，汉白玉栏杆依旧冰凉光滑。只是住在里面的人不在了，跪在下面的人也不在了。它安静地坐在北京城的正中央，像一个不再开口说话的老人，把所有的故事都咽进了肚子里。"
 landmark_prague_castle: "布拉格城堡"
 landmark_prague_castle_desc: "布拉格城堡坐落于伏尔塔瓦河西岸山丘上，始建于9世纪，是波西米亚王冠的千年象征。圣维特大教堂尖塔刺入天际，旧皇宫、圣乔治大殿与黄金小巷依山势错落排列。\n奥匈帝国崩溃后，城堡成为捷克斯洛伐克总统府，总统在此宣誓就职。而多瑙战争后波西米亚成为德国临时军事占领区，城堡旗杆上升起德意志军旗。总统办公室改为德军指挥部，捷克卫兵被德军岗哨取代。\n城堡仍然那座城堡。高墙依旧，尖塔依旧，伏尔塔瓦河依旧在山脚下流淌。它沉默不语，等待着下一次钟声的响起"
 landmark_bojnice_castle: "博伊尼采城堡"
 landmark_bojnice_castle_desc: "博伊尼采城堡矗立于匈牙利王国博伊尼采镇上方的石灰华山丘上。1113年的佐波尔修道院文献中已见其名，初为木堡，13世纪由波兹南家族以石材重建。1643年起归帕尔菲家族所有。\n19世纪末，末代主人扬·帕尔菲伯爵以法国卢瓦尔河谷城堡为范本，耗费约二十二年时间将其重建成如今这般浪漫的新哥特式宫殿——尖塔刺向天空，陡峭的屋顶覆着彩色琉璃瓦。黄金大厅的天花板通体镀金，雕刻着一百八十三个神态各异的小天使。城堡下方还天然生出一个直径二十二米的石灰华溶洞。\n1935年的当下，奥匈帝国崩溃的尘埃尚未落定，多瑙战争的余波仍在边境回荡。这座被誉为童话原型的城堡依旧静静矗立在山丘上，像一个不愿醒来的梦，等待着看下一阵风会把旗杆上的旗帜换成哪种颜色。"
