l_simp_chinese:
 infrastructure: "基础设施"
 infrastructure_plural: "基础设施"
 infrastructure_desc: "此建筑将改善所属地区的基础设施状况，提高你在战略要地的后勤能力及你的陆军部队在本地区的移动速度，并提升此地区的基础资源产出。"
  arms_factory: "军用工厂"
 arms_factory_plural: "军用工厂"
 arms_factory_desc: "此建筑可为所属地区提供生产军事装备的工业能力，或可因需转换为民用工厂。"
 dockyard: "海军船坞"
 dockyard_plural: "海军船坞"
 dockyard_desc: "此建筑可为所属地区提供建造新舰船的工业能力。"
 dam: "大坝"
 dam_plural: "大坝"
 dam_desc: "水坝为地区提供额外的电力，提高工业和资源产出。"
 dam_mountain: "$dam$"
 dam_mountain_plural: "$dam_plural$"
 dam_mountain_desc: "$dam_desc$"
 cataract_dam_mountain: "卡塔拉特水坝"
 cataract_dam_mountain_plural: "卡塔拉特水坝"
 cataract_dam_mountain_desc: "卡塔拉特水坝于1907年竣工，是澳大利亚殖民时期早期最具代表性的工程壮举之一。这座水坝坐落于新南威尔士州南部高地的卡塔拉特河上，至今仍是向悉尼市提供淡水的四大主要水源之一。"
 canal_kiel: "基尔运河船闸"
 canal_kiel_plural: "$canal_kiel$"
 canal_kiel_desc: "为了使运河满负荷运行，基尔运河船闸至关重要，破坏它们将会在很长一段时间内妨碍航运和交通。"
 canal_panama: "巴拿马运河船闸"
 canal_panama_plural: "$canal_panama$"
 canal_panama_desc: "巴拿马运河船闸是运河满负荷运作所必需的设施，破坏它们将会长时间阻碍航运和交通。"
 industrial_complex: "民用工厂"
 industrial_complex_plural: "民用工厂"
 industrial_complex_desc: "此建筑可为所属地区提供生产民用商品或建造新建筑的工业能力，或可因需转换为军用工厂。"
 air_base: "空军基地"
 air_base_plural: "空军基地"
 air_base_desc: "此建筑可为所属地区提供部署空军飞行器的场所。"
 naval_base: "海军基地"
 naval_base_plural: "海军基地"
 naval_base_desc: "该建筑可延长你的舰队航程，进行舰船维修，进行海外后勤补给以及资源出口。海军基地可随等级的提升增加补给吞吐量。"
 bunker: "陆上要塞"
 bunker_plural: "陆上要塞"
 bunker_desc: "此建筑可在战斗中对进攻方造成基于建筑等级每级$VALUE|+%0$的进攻惩罚。同时受到来自多方向的攻击时则会降低要塞效果。"
 coastal_bunker: "海岸要塞"
 coastal_bunker_plural: "海岸要塞"
 coastal_bunker_desc: "此建筑可在登陆作战当中对进攻方造成基于建筑等级每级$VALUE|+%0$的进攻惩罚。"
 anti_air_building: "防空阵地"
 anti_air_building_plural: "防空阵地"
 anti_air_building_desc: "此建筑可为所属地区面临轰炸机来袭时提供保护，并对敌军飞行器发动打击。"
 synthetic_refinery: "合成炼油厂"
 synthetic_refinery_plural: "合成炼油厂"
 #synthetic_refinery_desc: "This building provides the state with +1 £resources_strip|3 and +2 £resources_strip|1."
 synthetic_refinery_desc: "此建筑可为所属地区提供"
 synthetic_refinery_amount: "$VALUE|Y0=$"
 synthetic_refinery_resource: "£resources_strip|$FRAME$"
 radar_station: "雷达站"
 radar_station_plural: "雷达站"
 radar_station_desc: "雷达可使你获得邻近地区的敌军部队情报。\n提高所属地区的雷达站等级，便可增加雷达的有效距离。\n雷达也能在所属地区附近提供更好的对空侦察能力，提高己方战机接敌的概率。\n此外雷达还会提升探测敌方舰队的能力。"
 rocket_site: "火箭基地"
 rocket_site_plural: "火箭基地"
 rocket_site_desc: "此建筑可为所属地区提供部署火箭的场所。"
 nuclear_reactor_heavy_water: "重水核反应堆"
 nuclear_reactor_heavy_water_plural: "重水核反应堆"
 nuclear_reactor_heavy_water_desc: "此建筑可为所属地区提供用于制造核武器的浓缩铀的生产能力。\n使用重水的核反应堆比石墨反应堆建造成本更低，但产出的可用于核武器生产的材料更少。"
 nuclear_reactor: "核反应堆"
 nuclear_reactor_plural: "核反应堆"
 nuclear_reactor_desc: "此建筑可为所属地区提供用于制造核武器的浓缩铀的生产能力。"
 commercial_nuclear_reactor: "民用核反应堆"
 commercial_nuclear_reactor_plural: "民用核反应堆"
 commercial_nuclear_reactor_desc: "此建筑不仅为国家提供用于制造核武器的浓缩铀，同时也为民用经济的发展提供电力。"
 nuclear_facility: "核研究设施"
 nuclear_facility_plural: "核研究设施"
 nuclear_facility_desc: "核研究实验设施允许你启动与利用核能有关的研究项目。"
 air_facility: "空气动力学与航空电子研究设施"
 air_facility_plural: "空气动力学与航空电子研究设施"
 air_facility_desc: "空气动力学和航空电子研究设施允许你启动飞机、火箭和相关电子产品的研究项目。"
 naval_facility: "海军工程设施"
 naval_facility_plural: "海军工程设施"
 naval_facility_desc: "海军工程设施允许你启动与水面舰艇和潜艇相关的研究项目。\n海军工程设施只能在沿海省份建造。"
 mega_gun_emplacement: "多级加速大口径火炮"
 mega_gun_emplacement_plural: "多级加速火炮"
 mega_gun_emplacement_desc: "这种大口径火炮采用多级加速，旨在实现无与伦比的射程。它利用一系列地下隧道，将炮弹加速到超音速，然后向远处的目标发射。"
 stronghold_network: "要塞群"
 stronghold_network_plural: "要塞群"
 stronghold_network_desc: "这是一处由大量地堡与坚固阵地组成的广泛的防御系统，其主要使命在于击退来犯之敌，以及确保关键战略区域的安全。"
 land_facility: "地面战设施"
 land_facility_plural: "地面战设施"
 land_facility_desc: "地面战设施允许你启动与地面战各方面相关的研究项目，如特种坦克或火炮。"
 landmark_statue_of_liberty: "自由女神像"
 landmark_statue_of_liberty_plural: "$landmark_statue_of_liberty$"
 landmark_statue_of_liberty_desc: "1886年法国赠送给合众国的礼物，位于纽约港入口处的自由岛上。铜像高46米，连同基座共93米，右手高举火炬，左手持有一块铭板，上面刻有美国独立宣言通过的日期。\n这座雕像原本象征着自由与希望，是移民抵达美国时最先看到的景象之一。二十世纪初的数十年间，数百万移民在她的注视下进入纽约港。\n大战惨败与大萧条之后，林德伯格上台执政，合众国转向专制体制。自由女神像的地位变得微妙起来。她没有被拆除，也没有被改名，但围绕她的公共活动大幅减少。基座周围的游览区域受到限制，官方不再将她作为国家象征进行宣传。火炬依然在夜间点亮，但亮度有所调低。\n如今她更像一座历史纪念碑，纪念一个已经结束的时代。游客仍然可以参观，但需要通过额外的安全检查，现场也看不到过去那种盛大的爱国主义集会。她站在那里，作为一个沉默的见证者，提醒着过往的人们这里曾经有过不同的理想。"
 landmark_big_ben: "大本钟"
 landmark_big_ben_plural: "$landmark_big_ben$"
 landmark_big_ben_desc: "大本钟位于伦敦威斯敏斯特宫北端，钟楼高九十六米，1859年建成。钟面直径七米，时针长二点七米，分针长四点三米。\n1935年的今天，大本钟仍在运行。每小时报时一次，钟声通过BBC广播传遍英伦三岛。钟楼的维护工作照常进行，但受经济萧条影响，预算有所压缩。议会曾讨论缩短夜间照明时间以节约开支，尚未付诸实施。\n这座钟楼是伦敦的标志性建筑，也是英国议会所在地的一部分。它经历过大战，见证过帝国的鼎盛与收缩。如今它依然矗立在泰晤士河畔，准时敲响每一个整点。"
 landmark_colosseum: "罗马竞技场"
 landmark_colosseum_plural: "$landmark_colosseum$"
 landmark_colosseum_desc: "罗马竞技场位于罗马市中心，公元72年至80年间由维斯帕先与提图斯两位皇帝兴建，是古罗马帝国规模最大的椭圆形竞技场。建筑长轴一百八十八米，短轴一百五十六米，高约四十八米，采用混凝土与砖石结构，共分四层，可容纳约五万名观众。\n如今是1935年。竞技场不再用于角斗表演，也不再是废墟中的采石场。意大利政府将其列为国家古迹，由文物部门负责维护。外墙北侧保留着完整的原始立面，南侧因地震坍塌露出内部结构，游客可沿阶梯通道参观地下囚室与兽笼所在的底层空间。墨索里尼政权将竞技场视为古罗马荣耀的象征，常在周边举行集会和游行，竞技场本身则作为背景出现在宣传影像中。夜间有时开启泛光照明，灯光照亮残缺的拱廊，投下长长的阴影。"
 landmark_cristo_redentor: "里约热内卢基督像"
 landmark_cristo_redentor_plural: "$landmark_cristo_redentor$"
 landmark_cristo_redentor_desc: "里约热内卢基督像位于科科瓦多山顶，高三十米，连同基座共三十八米，臂展二十八米，由法国雕塑家保罗·兰多斯基设计，巴西工程师海托尔·达席尔瓦·科斯塔负责施工，1931年竣工落成。整体采用钢筋混凝土结构，外层覆盖滑石马赛克，面向瓜纳巴拉湾，双臂张开呈十字形。\n如今是1935年。基督像落成不过四年，已是里约热内卢最醒目的地标。山顶有齿轨铁路运送游客，基座内设小礼拜堂。夜间尚无泛光照明，但月光下白色身躯在黑暗山体上格外清晰。巴西政府将其视为国家团结的象征，常在重要纪念日于山下举行集会。这座雕像俯视着这座城市，也俯视着这个正在工业化与城市化浪潮中剧烈变形的国家。"
 landmark_eiffel_tower: "埃菲尔铁塔"
 landmark_eiffel_tower_plural: "$landmark_eiffel_tower$"
 landmark_eiffel_tower_desc: "埃菲尔铁塔矗立于巴黎战神广场，高330米，1889年为世界博览会而建。建成时它是世界上最高的建筑物，象征着工业时代的自信与法兰西的荣耀。\n大战之后，这座铁塔的命运发生了微妙的变化。它仍然是巴黎最显眼的地标，但围绕它的光环有所暗淡。游客数量减少，维修经费紧张，铁锈在钢架上悄悄蔓延。塔顶的无线电发射塔依然每天发送信号，只是接收这些信号的，是一个不再那么确信自己位置的法国。\n如今它更多地被视为一段记忆的载体——关于一个相信进步、相信未来、相信铁塔会永远闪光的时代。夜晚的灯光依然亮起，但亮度调低了，仿佛怕惊扰了什么。"
 landmark_kremlin: "克里姆林宫"
 landmark_kremlin_plural: "$landmark_kremlin$"
 landmark_kremlin_desc: "莫斯科克里姆林宫是一个堡垒建筑群。建筑群内有大克里姆林宫，它曾是俄罗斯皇帝的皇宫。克里姆林宫俯瞰南边的莫斯科河，东边的圣瓦西里大教堂和红场，以及西边的亚历山大花园。如今，它代表着国家的权威及其对人民的控制。"
 landmark_berlin_reichstag: "帝国议会"
 landmark_berlin_reichstag_plural: "$landmark_berlin_reichstag$"
 landmark_berlin_reichstag_desc: "德国国会大厦，也被称为国会大厦，是柏林共和国广场上的一座历史性立法政府建筑。直到1933年国会大厦火灾之前，德国联邦议会一直在此办公，但即便如此，这座象征性建筑在人民的心中依然具有重要意义。"
 landmark_tokyo_imperial_palace: "皇居"
 landmark_tokyo_imperial_palace_plural: "$landmark_tokyo_imperial_palace$"
 landmark_tokyo_imperial_palace_desc: "东京皇居是自明治维新最后一任幕府被推翻以来天皇的主要居所，它是日本人民自豪与崇敬的象征，激励着他们努力工作。"
 landmark_national_diet: "国会议事堂"
 landmark_national_diet_plural: "$landmark_national_diet$"
 landmark_national_diet_desc: "国会议事堂位于东京永田町，1建筑采用钢筋混凝土结构，中央塔楼高六十五米，左右两侧分别为众议院与参议院议事厅。整体风格融合西洋古典与日本近代建筑元素，外观庄重沉稳。\n这座建筑是日本近代政治制度的象征。大正年间政党政治兴起，议会权力逐步扩大，国会议事堂的建设正是这一进程的物质体现。\n1935年的当下，建筑主体已基本完工，正在进行内部装修与设备调试。它的落成标志着日本议会政治进入一个新阶段，尽管军部势力抬头、政党间的对立日益尖锐，这座建筑的存在本身仍代表着文官政治与议会制度的物理空间。\n国会议事堂的钟塔面向霞关方向，整点报时钟声可覆盖周边官厅街区。楼内设有天皇御座室、首相休息室及各党派议员办公室，是日本政治运作的核心场所。"
 landmark_hakko_ichiu: "八纮一宇塔"
 landmark_hakko_ichiu_plural: "$landmark_hakko_ichiu$"
 landmark_hakko_ichiu_desc: "八纮一宇塔为纪念日本建国2600周年而建，是象征日本“八纮一宇”命运、将世界八方统一于一个屋顶之下的纪念碑。"
 landmark_hofburg_palace: "霍夫堡宫"
 landmark_hofburg_palace_plural: "$landmark_hofburg_palace$"
 landmark_hofburg_palace_desc: "霍夫堡坐落于维也纳市中心，是哈布斯堡王朝昔日的冬宫与帝国权力中枢。建筑群始建于13世纪，历经七百余年扩建，融合哥特、巴洛克、洛可可等多种风格，占地逾二十四万平方米，由十八座翼楼与十九座庭院组成，素有“城中之城”之称。\n王朝终结后，霍夫堡归军方所有。如今它既是军方办公驻地，也容纳国家图书馆、西班牙骑术学校及多处博物馆。新宫原计划建成对称双宫结构，另一半因资金短缺搁浅。这道未完成的弧线，恰似这个多民族帝国当下的处境：辉煌犹在，余韵难全。"
 landmark_berlin_volkshalle: "人民大厅"
 landmark_berlin_volkshalle_plural: "$landmark_berlin_volkshalle$"
 landmark_berlin_volkshalle_desc: "人民大厅象征着我们民族不可战胜的精神，以及他们征服世界的自豪意志。它将向全世界展示，通过征服的力量，一切皆有可能，祖国甚至可以使最不可能的任务成为可能。"
 landmark_sadabad_complex: "萨德阿巴德宫"
 landmark_sadabad_complex_desc: "萨德阿巴德宫位于德黑兰城北谢米兰山麓，占地广阔，是恺加王朝始建于十九世纪的王室夏宫。1921年礼萨·汗掌权后占据此处，对原有建筑进行修缮，并在此后十余年间新建多处宫殿，将其扩建成集居住、理政与礼仪功能于一体的宫殿群。\n建筑群融欧洲古典与波斯传统风格于一身。大理石、灰泥、瓷砖与镜饰被巧妙运用于内部装饰，各宫殿由伊朗及国际建筑师分别设计，呈现出古典与现代并存的面貌。其中白宫始建于1931年，至1936年完工，是宫殿群中规模最大的建筑。\n如今，这座宫殿群仍是德黑兰权力运作的核心场所之一。园内古树参天，渠道纵横，宫殿隐于绿荫深处。它见证着这个国家从恺加王朝的余晖走向巴列维时代的嬗变，也承载着波斯帝国在二十世纪试图重塑自我的全部野心。"
 landmark_taj_mahal: "泰姬陵"
 landmark_taj_mahal_desc: "泰姬陵位于印度阿格拉城东南，亚穆纳河南岸，是莫卧儿帝国皇帝沙贾汗为皇后慕塔芝玛哈修建的陵墓，始建于1632年，历时约二十二年建成。主体建筑由纯白大理石筑成，高七十三米，中央穹顶呈洋葱形，四角立有四座宣礼塔。陵墓坐落在八角形基座上，前方是长条形水池与莫卧儿式花园，整体布局严格对称，融合波斯、伊斯兰与印度建筑风格。\n泰姬陵以其石材镶嵌工艺闻名。白色大理石表面嵌有翡翠、水晶、玛瑙等各类宝石，拼成繁复的花卉与几何图案。不同时辰的光线下，陵墓呈现从粉红到银白的色调变化。"
 landmark_hagia_sophia: "圣索菲亚"
 landmark_hagia_sophia_desc: "圣索菲亚位于伊斯坦布尔，公元537年由拜占庭皇帝查士丁尼一世下令建成，是拜占庭建筑的巅峰之作。中央穹顶直径约三十二米，通过帆拱支撑，内部以彩色大理石镶嵌，光线从四十扇窗户倾泻而入。\n1453年奥斯曼帝国征服后，建筑被改为清真寺，宣礼塔与米哈拉布相继添加，基督教马赛克被石膏覆盖。民族独立战争以及土共夺权后其同样也不可避免受到了改组"
 naval_supply_hub: "海军补给中心"
 naval_supply_hub_desc: "此建筑可在该基地为你的舰队提供母港之外的补给与燃料，从而可能延长你的§Y特遣舰队§!的行动范围。\n海军补给中心只能建在拥有至少8级海军基地的沿海省份。"
 naval_headquarters: "海军指挥部"
 naval_headquarters_desc: "此建筑使你能分配一名海军将官，以提升海军指挥部影响范围内§Y特遣舰队§!的行动效率。\n\n最多可同时指派海军将官的指挥部数量为$MAXNUM|H$座.\n‑当前已指派：$CURRNUM|H$座\n\n海军指挥部只能建在拥有至少8级海军基地的沿海省份。"
 landmark_great_wall_section: "万里长城"
 landmark_great_wall_section_desc: "长城横亘中国北方，始建于公元前7世纪，历代不断修筑，至明代形成今日规模。墙体以夯土、石块与青砖砌成，沿山脊蜿蜒起伏，绵延约两万余里。每隔数百米设烽燧敌楼，遇警则燃烟举火，消息一日千里。\n1935年的当下，长城早已失去边防功能。垛口间荒草蔓生，敌楼多有坍塌，墙身被风沙侵蚀剥落。它静卧在山峦之上，像一个不再开口的老人，默默注视着关内关外的世事变迁。"
 landmark_great_wall_section_plural: "$landmark_great_wall_section$"
 landmark_nanjing_presidential_palace: "南京总统府"
 landmark_nanjing_presidential_palace_desc: "南京总统府是一座古老而庄严的建筑群，清朝灭亡后，伟大的孙中山先生曾在此宣誓就职。"
