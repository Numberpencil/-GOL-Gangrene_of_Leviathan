 USA_Great_Depression: "大萧条"
 USA_American_melancholy: "美式忧郁"
 USA_Post_Prohibition_Era: "后禁酒令时代"
 USA_Collapsed_democracy: "宪政之终"
 USA_combat_readiness: "战备状态"
 # 理念描述
 #USA_generic_idea_desc: "理念描述"
 USA_Great_Depression_desc: "1929年华尔街的崩塌从未真正结束。银行倒闭潮席卷全国，农场被抵押拍卖，工厂大门焊死，失业率徘徊在百分之二十以上。联邦政府的补救措施如同往深渊里扔纸团，林德伯格上台后用公共工程与扩军吸纳失业人口，但经济的根基依然腐烂。股市偶有反弹，旋即再次下跌。人们在面包店门口排队，在废弃的铁轨旁搭帐篷。繁荣的年代像一场被已经消散的美梦，然而噩梦还在继续。"
 USA_American_melancholy_desc: "南北战争的伤疤从未真正愈合，而后大战的惨败又添新伤。葛底斯堡的演说听起来像另一个世界的回声，潘兴远征军的墓碑一排排躺在法国的泥土里。美国人的脸上少了一种东西——那种旧照片里常见的、相信明天会更好的神情。爵士乐还在唱，但旋律里多了几分苦涩。电影院里放映着歌舞片，散场后人们低头走进寒风。这个国家失去了对自己的信心，像一个人照镜子时认不出镜中的面孔。"
 USA_Post_Prohibition_Era_desc: "宪法修正案在大恐慌后被废止，但它留下的地下网络并未消失。芝加哥、纽约的黑手党组织早已在私酒生意中积累了巨额财富与武装力量，如今转而经营赌博、走私与敲诈。地方警察被收买，法官收到信封，政客的竞选资金里有来历不明的现金。林德伯格的铁腕治安手段打击了一批帮派头目，但黑市的根系已经深入社会的土壤。禁酒令走了，它的孩子留了下来。"
 USA_Collapsed_democracy_desc: "南北战争后两党制便逐渐瓦解。进步党、社会党、农民—劳工党等第三势力崛起，国会陷入多党混战的局面。而这种多极政治带来的混乱在大恐慌后林德伯格的华盛顿进军之后以强权手段瓦解，而后以“国家团结”为名建立单一政党体制，这无疑是美国民主的失败象征。\n\n§Y我们合众国人民，为建立一个更完善的联邦，树立正义，保障国内安宁，提供共同防务，促进公共福利，并使我们自己及后代得享受自由之赐福，特为美利坚合众国制定和确立本宪法。--《美利坚合众国宪法》§!"
 USA_combat_readiness_desc: "林德伯格以扩军应对大萧条。陆军从三十万人扩充至七十万，海军重启造舰计划，飞机制造厂昼夜运转。兵营在全国各地拔地而起，年轻人的军饷养活了一大批依赖军事基地的小镇经济。失业率因此下降，工厂的烟囱重新冒烟。\n代价同样沉重。军费开支占联邦预算的比例逐年攀升，国债规模突破历史纪录。财政部每年支付的利息超过教育、医疗与基础设施建设的总和。经济对军购的依赖日益加深，一旦订单减少，连锁反应将波及每一个角落。战备状态像一剂强效药——暂时缓解了症状，也让身体离不开它。"