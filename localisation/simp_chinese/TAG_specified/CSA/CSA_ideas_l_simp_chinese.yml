 # 理念名称
 #CSA_generic_idea: "理念名称"
 CSA_Trust_hegemony: "托拉斯霸权"
 CSA_Trust_hegemony_tt: "§R德克萨斯开采权由合众国控制§!"
 CSA_Caudillo_style_politics: "考迪罗式政治"
 CSA_Chaotic_country: "混乱之国"
 CSA_economic_collapse: "经济崩溃"
 CSA_corrupt_and_backward_army: "腐朽落后的军队"
 CSA_Sharing_Plan: "共享计划"
 # 理念描述
 #CSA_generic_idea_desc: "理念描述"
CSA_Trust_hegemony_desc: "联盟国缺乏发展工业所需的资本与技术。北方的托拉斯企业趁虚而入，以贷款、合资与技术授权的名义控制了联盟国的矿山、铁路、油田与港口。利润的大头流向纽约与芝加哥的账户，本地工厂主只能捡拾残羹剩饭。经济数据在纸面上逐年好转，但增长的果实并不属于这片土地。联盟国的经济命脉握在别人的手里，每一次呼吸都要看北方的脸色。"
CSA_Caudillo_style_politics_desc: "联盟国的政治架构围绕总统的个人权威运转。宪法赋予行政首脑广泛的权力，司法与立法机构形同虚设。总统既是国家元首，也是军队统帅，还是各州之间矛盾的最终仲裁者。这套制度在强势领袖手中运转顺畅，但每一次权力交接都是一场豪赌——继任者能否镇住各方势力，无人能够保证。总统的更替往往伴随着骚乱、政变或至少是暗流涌动的密室谈判。"
CSA_Chaotic_country_desc: "联盟国的人口构成如同一锅沸腾的杂烩。英裔种植园主后裔占据社会顶层，爱尔兰裔与德裔工人聚居城镇，意大利裔在码头与市场抱团生存，黑人佃农在棉花田里弯腰劳作，墨西哥牧人沿着边境放牧。各族群之间通婚极少，居住区泾渭分明，语言、宗教与习俗的差异处处可见。地方政府往往由某一族群把持，对其他群体施加歧视性政策。这个国家还没有解体，仅仅是因为所有人暂时找不到更好的去处。"
CSA_economic_collapse_desc: "大萧条对联盟国的打击几乎是毁灭性的。棉花价格跌至南北战争以来的最低点，烟草出口量腰斩，伐木业与采矿业的订单被大规模取消。银行接连倒闭，农民的抵押品被没收，城镇的主街上到处贴着“招租”与“歇业”的牌子。州政府财政收入锐减，教师与警察领不到薪水。联邦政府试图发行债券救市，但国内外投资者对联盟国的偿债能力毫无信心。经济不是在下滑，而是在坠落。"
CSA_corrupt_and_backward_army_desc: "联盟国的军队自大战结束后便几乎没有更新过装备。主力步枪仍是十几年前大战的型号，机枪数量稀少，炮兵牵引依赖骡马。海军仅有几艘老旧炮艇用于近岸巡逻，空军只有数十架过时的双翼飞机。军官团规模臃肿，营养不良与疾病发病率居高不下。军校教授的战术理论停留在上一个世纪，对于机械化战争的概念几乎无所知晓。这支军队用来镇压内部骚乱尚且勉强，面对外部威胁则不堪一击。"
CSA_Sharing_Plan_desc: "共享休伊·朗在大恐慌最深的时刻当选总统。他以“共享财富”为口号，提出了一套激进的经济改革方案：对个人财产设置上限，超额部分由国家征收用于全民分配；国有化关键产业，包括铁路、矿山与能源设施；向合众国托拉斯征收高额特别税，逐步收回经济主权。这套计划在穷人与底层白人中获得狂热支持，但也触怒了地主、工厂主与北方的利益集团。国会内部斗争激烈，暗杀传闻不绝于耳。共享计划是联盟国最后的救命稻草，还是一根点燃火药桶的火柴，尚未可知。计划"