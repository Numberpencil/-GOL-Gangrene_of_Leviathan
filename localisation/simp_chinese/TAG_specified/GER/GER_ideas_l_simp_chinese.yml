l_simp_chinese:
 toward_collapse:0 "走向崩溃"
 toward_collapse_desc:0 "我们戴上了大战的桂冠，我们成为了欧洲的霸主，我们实现了德意志之梦，但为何会如此？\n始于1914的战争取得了胜利，我们捣毁了自由主义和个人至上的巢穴堡垒，德意志文化成为了大地上的主旋律，但是，短短二十年载，社会秩序不断熵增，迈向无序，青年们呼吁“革命！挑战！复兴”、士兵们痛斥他们的汗血未庸应有之荣誉、工人们抱怨黄油、猪肉的高昂售价，人们的积怨如雪球滚积，德国的世代正走向崩溃的深渊...... \n“我所知道的是：我不属于这个时代也不属于这个世界。我的祖国必须变得更加强大。”"
 rotten_and_obscurantist_system:0 "腐朽晦暗的体制"
 rotten_and_obscurantist_system_desc:0 "帝国自从兴登堡内阁中期便陷入了政治斗争和腐败贪污之中。官僚系统的暗流、街头纷争的漩涡，不可见的手经由体制的渠道操弄木偶般的民众，勾心斗角、尔虞我诈，团结一致的民族在民主的斡旋中渐渐被物质主义和欲望所充盈。\n公意不再作为衡量民主与否的概念，权力成为公民的主导者，政客以恐惧为盾，在舆论的城堡指挥他的军团，祖国的黑夜漫漫......."
 Weltpolitik:0 "世界政策"
 Weltpolitik_desc:0 "随着大战的胜利，我们摧毁了过时老朽的旧秩序，并让世界颤抖。德国已经崛起了，我们必须继续保持这一优势，让帝国于世界永恒不朽！\n\n这是以人民的名义！\n这是以血的名义！\n这是以苦难的名义：\n永恒伟大的德国，\n我们向您致意，德国！”"
 Mitteleuropa_trade_agreement:0 "中欧贸易协定"
 Mitteleuropa_trade_agreement_desc:0 "帝国在战后为了孤立英、法、俄以及更好地促进德国和各个国家之间的联络与经济支持，组建了中欧协定这一目前雄立于世界的经济体。帝国开辟的阳光下的地盘与东部广袤的土地将支撑起德意志的伟业。\n贸易协定让德国企业与重工业顺利地打入成员国体系，但代价是德国的资本大量的被投资于其他国家的基础设施建设，而其他国家也要在这一经济体中与德国绑定在一起。"
 The_aftermath_of_the_economic_crisis:0 "经济危机的余波"
 The_aftermath_of_the_economic_crisis_desc:0 "三十年代，祖国陷入了经济危机，股票与证券交易所一片狼藉，自杀率达到高峰，社民党内阁的政策非但不能阻止危机的扩大蔓延，反而导致通胀的跃升、经济的萎缩，交易指数下跌，人们对于未来的前景不再。尽管后续上台的保守-民社联盟集中性地平息了风暴，巨浪得以抚平，但危机阴影似乎还在地平线的不远处。\n“我看到受苦者，天神就来到我面前。”"
 Heil_dir_im_Siegerkranz:0 "万岁，胜利者的桂冠！"
 Heil_dir_im_Siegerkranz_desc:0 "1914的热烈梦想，1918的凯旋神话，德意志民族的浮士德灵魂用利剑征服了广袤的大地。铁蹄踏过中欧的原野、履带驶过西欧的泥土，欧洲为此俯首称臣。从梅梅尔到阿尔萨斯、从北海到喀尔巴阡山，泛日耳曼之梦终于实现，在付出无数士兵的汗血、工厂的艰辛、家庭的苦劳之后，胜利者的荣光存于每一个德国人的心中。这是他们应有的冠冕————一个狂飙民族长久以来的野望。"
 Capital_outflow:0 "资本东流"
 Capital_outflow_desc:0 "德国这个中欧国家一直欠缺战略资源和原材料，因此占取更多土地以扩充战略资源储备，东部卫星国能够为德国提供粮食、石油和橡胶等战略资源。但是，对东方空间的占取在经济上开辟了更多的商贸形式，这这不仅刺激了市场需求，也改变了德国的经济结构。\n低廉的斯拉夫劳动力不可避免地让资本向东流去，产业和资本的外流削弱了国家对经济运行的自主控制能力。如今，国家民主化的行政和去中心化的掌控力不足以控制外流的趋势，市场......正如自然一般，不随意志而改变，东流问题已是未来前进的重要障碍。"
 Imperial_army:0 "帝国陆军"
 Imperial_army_desc:0 "突击队与炮火的挽歌在战场奏鸣，普鲁士传统的命令、执行是即时的哨音，这便是陆军的传统：刻入灵魂的法则。这正是普鲁士陆军屡获胜利的根基。\n从野战转入治安，帝国的宏大攻势转向了防御与内政姿态，猛虎栖息......大战的经验被奉为圭臬、老毛奇的谋略尊为制胜的法宝，许多人坚信步兵和骑兵是普鲁士军队的骨干，帝国的陆军沉湎于胜利中，固守在一方水土、囿于往昔荣光。然却，未来前景如何，嘈杂的议论在参谋部长廊间回荡，保守者坚持步兵为上，而激进者妄图让装甲取代传统机动职能。轰鸣的巨构巨兽或可成为战场的国王......"
 Imperial_navy:0 "帝国海军"
 Imperial_navy_desc:0 "世界大战后，为了巩固我们的霸权地位，我们打造了一支强大的海军。不过，要维持它并不容易，况且它还能经受当代的新挑战吗？"
 Imperial_air_force:0 "帝国空军"
 Imperial_air_force_desc:0 "在上一次世界大战中，空军的力量逐渐凸显，唯有打造一支强大的空中力量，我们才能捍卫祖国的领空乃至发动进一步的攻击。战后，空军该向什么方向发展呢？旧有的经验在新的局势下还有用吗？"
 GOL_idea_GER_megastructure_combat_data:0 "巨构机巴尔干实战数据"
 GOL_idea_GER_megastructure_combat_data_desc:0 "来自巴尔干前线的巨构机实战报告为帝国提供了宝贵的第一手数据。这些数据涵盖了改进型巨构机在真实战场环境下的装甲抗击、地形适应性、火力输出效率以及后勤维护需求，对帝国后续的巨构机研发与改良具有重大参考价值。"
