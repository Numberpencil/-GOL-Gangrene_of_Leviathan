GER_Getting_close_the_Crown_Prince_desc: ""
GER_1935_Nuremberg_Party_Rally: "1935年纽伦堡党代会"
GER_1935_Nuremberg_Party_Rally_desc: "第三届党代会再度召开，党决议在愈演愈烈的政治冲突中获得足够优势，希特勒在此宣告了一个警告信号，纳粹党将取缔作为德国权力基础与根基的保守派，戈培尔在党代会上告示所有人——作为德国年轻活力的政治组织，民社党将带领学生、工人、农民等一切面临窘迫处境的体力劳动者与脑力劳动者参与这场世界观的革命。最为激进的斯特拉瑟声称一场新的、同狂飙突进一致的褐色革命将重塑德国的政治生态与国家结构——荣誉代替腐朽、一体代替民主、革命对抗保守、民族社会主义对抗资本主义。"
GER_German_People_Association: "全德人民社团"
GER_German_People_Association_desc: "民族社会主义世界观同保守派的价值体系不同，他们认为，传统的社会价值体系是普鲁士的根基，世代传承的阶级已然是民族的历史形态——民族社会主义者不同，传统阶级代表的是腐朽落后的庄园土地、剥削劳动者的无能资产者，他们对于贵族特权和身份尤为看重，但我们只看一个人的社会贡献，那才是他作为德意志人的价值所在。那些保守者无非还想要一个普鲁士-容克集团的德国，而我们，民族社会主义，不仅善于打破旧秩序，还善于缔造民族共同体德国！"
GER_LOffensive: "《进攻报》"
GER_LOffensive_desc: "一根易断，一捆难败。民族社会主义是播种机，是春醒，是民族精神的复兴——日耳曼先祖的共同体精神以血脉形式传承，而现代的技术——电视台、广播、印刷机——无疑为宣传如虎添翼，集会和传单的效果尚浅，而短促有力的口号、井井有序的组织、生动有形的海报等方式只是武器，而最重要的是我们虔诚的民社党宣传家，戈培尔博士将成为党的信使，为人民带来民族社会主义的真谛。舆论与报纸将成为我们与保守派抢夺的话语阵地。"
GER_Steel_Helmet_Alliance: "钢盔联盟"
GER_Steel_Helmet_Alliance_desc: "保守势力的基层人员甚至中层人员与我们的共同点远胜于分歧，我们的冲锋队，都是前自由军团战士或退伍老兵，士兵们对于我们的革命承诺与宣言深有好感，或许，一个广大可靠的士兵联络网能团结这些为祖国而战的小伙子们，要让战士们知道——我们才是德意志民族的先锋与开拓者，民族灵魂的战友之情联系着我们，而保守派无非是顽固的旧贵族，他们是资产阶级的代表人与拥护者！"
GER_Brown_Storm: "褐色风暴"
GER_Brown_Storm_desc: "人民在呼唤，祖国的士兵与工人们都在呼吁一场新的变革，而民社党是这场变革的先锋，现如今，全德的街道已为民社党所掌控，褐色风暴席卷大地，交织着队伍的铁靴踏地与工人们的呐喊声向保守派堡垒进攻。"
GER_Listen_to_the_Shadows: "监听暗影"
GER_Listen_to_the_Shadows_desc: "赫尔曼戈林与海德里希深知情报收集与渗透工作的作用，后者将作为党政安保处的负责人捍卫党，同时，对于敌对党派势力进行渗透与侦察甚至于策反——无论是保守派，还是社民党，抑或是中间群体。"
GER_Black_Legion_Search_Warrant: "黑色军团搜查令"
GER_Black_Legion_Search_Warrant_desc: "情报工作取得进一步之战后，来自突击队的务实骨干们决议转守为攻，那些保守派老狐狸自以为机关算尽，却往往忽视年轻人的活力与意外性，这支在暗影中活动的黑色军团用谋术监听着电话，用各种手段打探侦察着对方的踪影。那些放松警惕的大腹便便还沉迷在胜利的愚梦中......"
GER_unite_forces_can_united: "...团结可团结的力量"
GER_unite_forces_can_united_desc: "在对阵保守派之时，我们或许可以寻找一些社会上的激进分子，毕竟，我们之间的“共识”在这方面大于分歧，敌人的敌人便是朋友。"
GER_Waffen_SS: "§N武装亲卫队§!"
GER_Waffen_SS_desc: "突击队自慕尼黑暴动以来便是党的精英护卫力量，它由才干卓越的海因里希·希姆莱统领，在希姆莱的策划与强化下，亲卫队将密切保护宰相的人身安全。揪出隐藏在人群里的危险分子，必要时可为宰相牺牲——他是德国的未来。"
GER_Operation_Hummingbird: "§N蜂鸟计划§!"
GER_Operation_Hummingbird_desc: "民社党高层正在谋划一场行动——倒计时来到最后一刻，冲锋队与突击队已经聚集完毕，来自慕尼黑的暴动经验警示着士兵们。一批标注重要人物与代表人的名单已交给大区的负责人......"
GER_Public_trial: "公开审判"
GER_Public_trial_desc: "妄图刺杀全德意志的宰相的叛国分子亦被揪出和逮捕，忠诚的亲卫队转移了元首，在安保处同志们的努力工作下，保守派的重要骨干与幕后策划者被一一捉住。一些人在事情败露前及时逃亡国外，他们对我党的事业不再有威胁。现在，帝国法庭将审判这些叛国分子。"
