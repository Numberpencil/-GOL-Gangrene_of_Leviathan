 # 理念描述
 #SPR_generic_idea_desc: "理念描述"
SPR_TOlivares_Act_desc: "在米格尔·德·毛拉首相上台之后，王国政府便颁布了雄心勃勃的奥利瓦雷斯法案，其目的在于推动西班牙全球帝国的一体化，以应对来势汹汹的经济危机。在该法案所阐述的愿景之中，各殖民地的资源与外汇被高度整合于统一的高关税保护市场之中，通过由马德里主导的中央调配来缓和矛盾。\n尽管奥利瓦雷斯法案确实稳住了濒临崩溃的帝国，却也在实施过程中暴露出诸多致命的缺陷——官僚主义的日渐腐蚀、行政效率的极度低下、成员国间的利益冲突，无不在逐步摧毁这项法案的存在根基。\n如今，马德里中央围绕着奥利瓦雷斯法案的未来爆发了巨大的争议。支持者们认为，这是推动帝国一体化的最后机会；而反对者却认为，这将会是又一次帝国崩溃的前奏……"
SPR_Constitutional_crisis_desc: "随着旧两党建制的式微与立宪复兴党的兴起，西班牙的宪政体系迎来了至暗时刻。纵使小毛拉的力挽狂澜暂时稳住了岌岌可危的政坛，却仍然无法阻止其滑向极端化与暴力化——而这一进程的主要推手，便是近年来迅速扩张的民族复兴党和工人社会党。在此之外，CNT、FAI、CGT等激进工会组织也正于全国范围内广泛动员工人运动，试图通过罢工手段重创帝国。不论怎样，毋庸置疑的是：宪政已然走向末路。"
SPR_The_Second_Great_Panic_desc: "由华尔街与柏林股市陨落所激起的千层巨浪，如今正横扫着整个世界：纽约、伦敦、罗马——以及我们的马德里。放眼四境，农田荒芜、工厂停工、商店歇业，西班牙在这场全球性的金融海啸中损失惨重。而我们必须采取一切可能的措施全力撑过危机，否则便将落得万劫不复之地。"
SPR_backward_army_desc: "自世界大战落幕后，帝国的军备事务便逐渐废弛，军队所面临的敌手也不过是菲律宾与里夫两地的散兵游勇。这直接导致西班牙武装力量的综合素质在过去十数年间不断下滑，直至跌落到如今这般令人不敢恭维的残败境地。"
SPR_Save_the_Empire_desc: "如今，西班牙的帝国基业正面临着史无前例的危机。远至墨西哥的工人革命、尼加拉瓜的反帝运动；近抵摩洛哥的抵抗浪潮、意大利的议会政变——这些因素无不在将帝国座钟的指针推向象征灭亡的零时。只有不惜代价、竭尽全力地捍卫帝国，西班牙才能避免消失于历史尘埃的结局。"
SPR_Family_rmies_Under_the_Covenant_desc: "自西班牙在1860年协助两西西里王国统一意大利以来，双方都力求取得对方的宗主地位——亦或是彻底脱离这种暧昧不清的从属关系。这种令人外交乱局持续了半个世纪之久，直至1901年才在两国达成的团结共识中得以结束。现如今，西班牙与意大利在密切合作的框架内共同取得了一系列令人瞩目的成就，所谓“地中海姊妹”之名也由此而来。"