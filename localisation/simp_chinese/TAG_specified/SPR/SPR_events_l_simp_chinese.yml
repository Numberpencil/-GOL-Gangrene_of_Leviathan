 # 事件标题
 #TAG.1.t: "事件标题"
 SPR.1.t: "帝国斜阳"
 # 事件描述
 #TAG.1.desc: "事件描述"
 SPR.1.d: "黄昏降落在埃斯科里亚尔。这座被称为西班牙唱诗班席的灰色宫殿，将帝国影子拉得比历史还长。1935年，暮光如旧金线滑落，西班牙依旧享受着帝国的荣誉。\n然而西班牙并非一向如此辉煌，西班牙的命运就正如横管整个西班牙的山脉一样跌宕起伏，西班牙总是会在某个节点急速下滑并在另一个时间节点飞速上升。一个世纪前，这个善于跌倒的国家奇迹般再次站稳：费迪南多七世的政变之刀被折断，王位继承战争短促如雷雨，钟声未歇，卡洛斯派的旗帜已湿透。宪法至上，资产阶级的西班牙从黄土里长出。\n墨西哥皇冠戴到阿斯图里亚斯亲王额前，里夫群山被炮火驯成保护国，两西西里的波旁血亲把意大利靴尖踢进罗马，地中海腰部重新环绕着西班牙语与钟声。特鲁希略的皮萨罗铜像，又听见了军号。\n王国飞速发展的经济更惊醒了这个古老的半岛国家。铁路贴着陡坡爬行，矿山翻开地表皮肤，有轨电车叮当驶过新林荫道。巴塞罗那的纺织机声压过圣家堂的锤音。西班牙像刚学会读写的孩子，兴奋地念出：银行、资本、宪法、铁路。而卡莱纳哈斯的自由党改革更为王国注入了新的生机与活力。\n飞速发展的经济，帝国领地的飞速扩张，不断推进的现代化让西班牙以自信的姿态投入到了七月危机掀起的世界大战中，相信着自己将在这场伟大战争中夺得荣耀与领土。一九一九年，停战钟声敲响，西班牙作为同盟国阵营的胜利者走出焚烧一切的烈焰。黑白红旗帜在柏林统领大陆，马德里在南方叼回战利品：摩洛哥的铁，地中海航道的钥匙，一把坐在餐桌主位的旧椅子。日落被硬生生拽回正午，荣光几乎将旧伤照得透明。\n可胜利的毒药比失败更凶。长期的战后经济萧条和政治暴力无时不刻不在侵蚀着这个国家。传统的两党制度解体宪政制度陷入崩溃深渊，自由党和保守党的再度联合才稍微挽救了西班牙陷入彻底的政治动乱。三十年代的第二次大恐慌更对西班牙这个国家造成了严重的冲击，由此来看西班牙似乎再次急转直下，迎来了周期性的再度衰落。\n在西班牙语里有两个动词意为“存在”。一个是estar，意为存在于某种特定的条件下，如一本书在一张桌子上，或者你的岳母生病了。另一个是ser，意为存在于某种状态下，如草是绿的，或者上帝在他的天堂里。拥有着新型现代化的外表，西班牙的estar正在改变，但在其下所有本质上的ser——仍然一成不变。\——萨尔瓦多·德·马达里亚加《西班牙史论》"
