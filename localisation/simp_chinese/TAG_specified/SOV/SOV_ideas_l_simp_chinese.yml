 # 示例：idea_TAG_00 或 idea_TAG_name
 # 理念名称
 #SOV_generic_idea: "理念名称"
 SOV_The_shackles_of_foreign_investment: "外资的枷锁"
 SOV_Romanov_Dynasty: "罗曼诺夫王朝"
 SOV_The_impact_of_the_panic: "大恐慌的冲击"
 SOV_The_restless_re_revolution: "躁动的再革命"
 SOV_The_Shame_of_Brest: "布列斯特之耻"
 SOV_National_Duma: "全国杜马"
 SOV_Ten_years_of_silence: "十年的沉寂"
 # 理念描述
 #SOV_generic_idea_desc: "理念描述"
 SOV_The_shackles_of_foreign_investment_desc: "俄罗斯帝国这个以依赖外资而经济腾飞的国家在与德国停战之后曾短暂陷入经济之冬，大战的惨败与大规模革命的爆发严重阻碍了帝国的经济发展而法国的战败和内战则更让帝国的经济问题雪上加霜。但在战间期德国和美国资本的涌入填补了法国外资萎缩的空缺，德美资本在俄罗斯国内的大笔投资有效提振了帝国经济，但是其也愈发加深了对帝国经济的掌控……"
 SOV_Romanov_Dynasty_desc: "大战的烈焰焚尽了欧洲三顶皇冠——哈布斯堡、奥斯曼，波旁相继崩塌。唯有罗曼诺夫在灰烬中站了起来。基里尔一世以屈辱换取帝国与王朝的延续，用割让西部边疆的代价保住了王座。这是一顶沾满灰尘却未曾坠地的王冠，幸存本身即是力量，也是负重。"
 SOV_The_impact_of_the_panic_desc: "1929年华尔街的崩塌跨过大西洋，外资如退潮般撤离。顿巴斯的矿井停产，乌拉尔的炼铁炉熄火，莫斯科郊外的纺织厂挂出停工告示。卢布贬值，财政部削减公务员薪俸，军官津贴亦被打折。街角的咖啡馆里，穿旧西装的男人对着空杯发呆。帝国的经济像一艘抛锚的船，帆已落，锚已沉，海面无风。"
 SOV_The_restless_re_revolution_desc: "1918年的革命已被镇压，但镇压并不等于消失。布尔什维克的残部越过山脉，在土耳其与高加索的山谷中找到藏身之所。他们在那里喘息、整理、等待。\n国内陷入短暂平静，但大萧条改变了这一切。失业的队伍在每个城市蔓延，配给站前的长队越来越长，人们的眼神从疲惫变成了某种更深的东西，这些念想似乎将在不久的将来对帝国命运产生极大的影响。"
 SOV_The_Shame_of_Brest_desc: "1920年的布列斯特和约划定的边界如同一道刀痕，横贯帝国的躯体。第聂伯河以西的土地——乌克兰的粮仓、基辅的古老金顶、波多利亚的黑土——尽数归于他人。外高加索的山脉与油田也一并失去。帝国退回十七世纪的疆界，像一个巨人被截去了双臂。每一张地图都在提醒帝国臣民：那里曾经是我们的。"
 SOV_National_Duma_desc: "基里尔一世在镇压革命后对原先的全国杜马进行彻底的民主化改革，赋予其立法与预算审议权。杜马现有议员四百余人，涵盖地主、工厂主、知识分子及少数工人代表。保守派、自由派与温和左翼三方角力，法案推进时常陷入拉锯。\n尽管沙皇仍在宪法里保留了必要时刻对杜马的干涉，杜马仍是帝国政治的重要阀门。"
 SOV_Ten_years_of_silence_desc: "大战的失败在陆军身上留下了两道伤口。一方面上让帝国的边境门户大开国防压力骤增，另一方面更在军官团中激起了强烈的不满与愤恨，憎恨着沙皇对德国的耻辱性妥协退让，更憎恨着日耳曼对于俄罗斯民族的羞辱。\n而战后裁军与长期经济萧条更使装备更新停滞。军官团也在大战之后陷入了因循守旧与保守的军事学说之中，军事思想的保守落后与帝国陆军建设的废弛和军费的低效率利用让帝国军队正陷入长达十年的沉寂"