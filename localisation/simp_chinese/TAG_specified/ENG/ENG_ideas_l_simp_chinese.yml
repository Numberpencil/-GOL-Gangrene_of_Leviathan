 #ENG_generic_idea: "理念名称"
 ENG_Silent_Britannia: "沉寂的不列颠尼亚"
 ENG_Tax_system_reform: "税制改革"
 ENG_mainland_policy: "大陆政策"
 ENG_depressed_economy: "经济萧条"
 ENG_Armament_innovation: "军备革新"
 ENG_Westminster_Agreement: "威斯敏斯特协定"
 # 理念描述
 #ENG_generic_idea_desc: "理念描述"
 ENG_Silent_Britannia_desc: "与德国的光荣和平并未带来预期的荣光。与奥斯曼土耳其的和约，让英国开辟了新的中东帝国弥补了大战惨败带来的疆域损失，却也背上了沉重的债务。自治领的呼声越来越大，印度的独立运动暗流涌动，爱尔兰的伤口还在渗血。伦敦依然是世界的金融中心，但英镑的统治地位已不如从前。泰晤士河上的雾气似乎比以往更浓，笼罩着这座疲惫的帝国都城。不列颠尼亚依然手持三叉戟，坐在她的宝座上，只是目光不再那么锐利。"
 ENG_Tax_system_reform_desc: "战后历届政府推行了一系列财政改革，进一步深化了劳合乔治1909的财政改革。这些改革扩大了政府的收入基础，使得财政部有能力维持公共服务与偿还战争债务。政府收支的数字证明了改革的有效性。财政部的官员们精打细算，试图在福利开支与军费需求之间找到平衡点。"
 ENG_mainland_policy_desc: "殖民地的接连丧失迫使英国调整战略重心。肯尼亚、缅甸、马来亚的旗帜一面面降下，自治领的离心倾向日益明显。伦敦意识到，帝国的时代正在落幕。外交与军事规划开始向内收缩——巩固英伦三岛的防务，强化与加拿大、澳大利亚、新西兰的联系，并强化在中东的投射能力。此外英国也开始推动自身与法俄两个战败国之间的联系以此对抗不断壮大的德国威胁。"
 ENG_depressed_economy_desc: "大恐慌沉重打击了这个以贸易立国的岛国。出口骤降，造船厂订单清零，煤矿与纺织厂大面积停工。失业率突破历史，苏格兰与威尔士的工业城镇沦为废墟。麦克唐纳的国民政府对此实施紧缩政策，削减公务员工资与失业救济试图挽救经济。经济数据在1933年后略有回升，但幅度远不足以弥补前几年的损失。"
 ENG_Armament_innovation_desc: "大战的经验教训正在被消化。空军率先行动，更多的经费正在投入空军，雷达系统的研发也在秘密推进。陆军开始试验装甲师的编制，并且推动巨构式装备与传统战争的结合以让其适应，但传统的拥护者仍在顽强抵抗。海军面临着最艰难的抉择——战列舰的时代是否真的结束了？航空母舰的建造计划在海军部内部引发了激烈争论。军备革新是一场缓慢的拉锯战，保守派与改革派在每一个预算项目上反复博弈。"
 ENG_Westminster_Agreement_desc: "这项协定标志着大英帝国向英联邦的实质性转型。自治领获得了近乎完整的主权，伦敦则换取了帝国体系的延续与经济协同发展的框架。协定生效后，帝国内部关税壁垒降低，资本与劳动力流动加速，加拿大的小麦、澳大利亚的羊毛、新西兰的乳制品以及印度的大麻等以优惠价格进入英国市场，英国的工业制成品也获得了稳定的海外销路。"