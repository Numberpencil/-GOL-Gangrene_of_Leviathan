l_simp_chinese:
 HUN.1.t:0 "卡尔遇刺"
 HUN.1.d:0 "哎你怎么似了"
 HUN.1.a:0 "快，保护陛下！"
 HUN.2.t:0 "权力真空"
 HUN.2.d:0 "你说的对，但匈牙利王国是由，，，"
 HUN.2.a:0 "我们的匈牙利，究竟会，变成什么样子（哽咽）"
 HUN.3.t:0 "奥托加冕"
 HUN.3.d:0 "帅OTTO帅"
 HUN.3.a:0 "奥托国王万岁，匈牙利万岁！"
 HUN.4.t:0 "傀儡瓦拉几亚"
 HUN.4.d:0 "超级拼装！"
 HUN.4.a:0 "让东方的朋友们，作出回答！"
 HUN.5.t:0 "瓦拉几亚脱离控制"
 HUN.5.d:0 "科团长，你人呢，你根本不在布加勒斯特！"
 HUN.5.a:0 "该死！"
 HUN.6.t:0 "对瓦拉几亚的最后通牒"
 HUN.6.d:0 "最后通牒是最后和通牒还是最后的通牒？"
 HUN.6.a:0 "我们不会善罢甘休"
 HUN.7.t:0 "瓦拉几亚拒绝要求"
 HUN.7.d:0 "我也干了"
 HUN.7.a:0 "那就没什么好说的了"
 HUN.8.t:0 "瓦拉几亚同意要求"
 HUN.8.d:0 "我其实没干"
 HUN.8.a:0 "算他们识相"
 HUN.9.t:0 "德国同意提供改进型巨构机"
 HUN.9.d:0 "来自柏林的回复终于抵达布达佩斯——德意志帝国同意了我们的请求。数台改进型巨构机及其配套维护人员将从德国经铁路秘密运往匈牙利前线。\n奥托一世在收到消息后，立即召集了总参谋部紧急会议。巨构机的到来将彻底改变巴尔干战场的力量对比——那些曾被嘲讽为”过时铁罐头“的钢铁巨兽，如今将以改进型的姿态碾碎一切阻碍。\n铁路线上，一列列覆盖着伪装网的超重型运输车正在夜色中悄然南下。匈牙利军官们被告知：这些钢铁巨兽将在抵达后四十八小时内完成组装，随后立即投入贝尔格莱德方向的攻势。"
 HUN.9.a:0 "钢铁巨兽已在路上"
 HUN.10.t:0 "德国拒绝提供改进型巨构机"
 HUN.10.d:0 "柏林的回复冰冷而简短——德意志帝国以“战略物资不得外泄”为由，正式拒绝了匈牙利关于改进型巨构机的请求。"
 HUN.10.a:0 "忘恩负义的柏林人"
