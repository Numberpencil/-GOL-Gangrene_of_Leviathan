# 国策描述
FRA_AA_Renationalization_policy_desc: "德国，西班牙为首的外来资本正在不断扼杀与征服我们的国家。我们的企业破产哀嚎，人民被迫承受外来者之剥削。如若我们想要做到独立自主与独立发展，对德西为首的外来资本进行国有化是必然的，哪怕为此彻底的得罪他们"
FRA_AA_Increase_investment_in_scientific_research_desc: "科技是国家实力评判方面的一个重要标准，可以让我们更快地追赶上德国，因此加大科研投资力度是必要的"
FRA_AA_Establish_national_foundation_desc: "设立一个基金会提高科研效率以及对其资助效率的提升是必要的"
FRA_AA_Investing_in_the_chemical_industry_desc: "法国贫乏的石油与橡胶资源让我们头疼不已，而如今化工业的推广貌似让我们看到了新的方法"
FRA_AA_Recruiting_scientific_research_talent_desc: "我们应该动员更多的科研人员投入到军事研究上"
FRA_AA_Sword_of_Damocles_desc: "居里夫人发现的新物质蕴含着奥秘，而如今对于其研究所带来的颠覆性设想已经让各国垂涎不已，我们理应也不该落后"
FRA_AA_Prepare_for_the_inevitable_battle_desc: "德法之间不可共存，将来的某一天我们必将再次互相厮杀，我们必须为那一天的到来做准备"
FRA_AA_Rearmament_desc: "自内战以来，法国的军队都面临着长时间的匮乏状况，我们的军队困乏贫弱，因而我们将推动装备的大生产与军队再整训"
FRA_AA_Strengthen_the_mobilization_system_desc: "在工业化战争里动员更多的人口已经成为评判胜负的重要标准，我们将渲染与号召更多的人加入进来为国服务"
FRA_AA_Mechanized_warfare_desc: "大战与大战后的数场战争已经彰显了机械化的优势我们只有紧跟时代才能确保不会落伍"
FRA_AA_military_construction_law_desc: "我们应当进一步推动国家军备建设以及国内动员，因此一个进一步调动国内资源支持战争的法案是必要的"
FRA_AA_Establishment_of_the_French_Economic_Council_desc: "设立一个旨在推动法国工业建设发展的委员会是必要的"
FRA_AA_Expand_sources_of_funding_desc: "为了支持我们的建设计划，通过发行国债等方法筹集资金是必要的"
FRA_AA_Rhone_Valley_Redevelopment_Plan_desc: "罗讷河谷广袤与丰富的资源理应得到进一步的开发来填补法国国内资源空缺的局面"
FRA_AA_Improve_construction_efficiency_desc: "如今的建设速度太过于缓慢，我们应该动员更多的工人与资源提高建设速度"
FRA_AA_Successfully_completed_desc: "随着委员会的计划大告成功，我们国家已经有了进一步的飞跃"
FRA_AA_Successfully_completed_tt: "建设工作基本竣工"
FRA_AA_Economic_take_off_desc: "我们在经过建设之后，经济已经开始飞速发展"
FRA_AA_Workers_Triumph_desc: "如今我们已经取得了议会的多数席位，工团主义已经在法兰西取得了胜利，我们必须进一步巩固成果"
FRA_AA_tough_countermeasures_desc: "犹豫就是失败，仁慈就是崩溃。秩序只能从强硬的意志中诞生。"
FRA_AA_Ensure_internal_loyalty_desc: "如今对于工团行动党的挑战将会极大的动摇我们内部的统治根基，部分工团党员的背叛坑会对大局造成难以想象的冲击，最大的威胁从来不在街垒对面，而在我们自己的队伍之中！一个动摇的党员比一百个敌人更危险——党的队伍绝不会被他们埋葬！"
FRA_AA_End_of_Corruption_desc: "美好年代与军政府时期的法国无可置疑的被资本主义堕落思想侵蚀了，而我们如今必须尽一切手段铲除令人厌恶的堕落思想"
FRA_AA_Ignite_the_flames_of_revenge_desc: "我们仍然无法忘记那近二十年前的耻辱，对法兰西民族来说只有我们牢记仇恨，用复仇的烈焰焚烧一切方能实现最终的复仇"
FRA_AA_Rebuild_Syndicate_desc: "若想复兴法兰西工业必先复兴与重构辛迪加，以计划的有序性取代军政府的无序性，制定统一的生产计划，分配资源与技术，并力取让每一位劳动者都变成生产的主人"
FRA_AA_Returning_to_secular_life_desc: "第三共和国的反教权法案是妥协的不彻底的，这无疑让邪恶的罗马教会与宗教分子可以继续在法国肆意妄为阻止法兰西的复兴，更可以茶毒每一个法兰西人民，我们必须制定更为彻底的反教权法案彻底驯服天主教会"
FRA_AA_Officers_Salon_desc: "我们需要进一步巩固与拉拢军队以确保政权的稳固"
FRA_AA_People_Storm_desc: "是时候将保护国家以及政府的责任交到人民手中了。我们将把车间和社区的民兵组织整合成一支真正的政治性组织，让保卫公社成为每个公民的神圣职责。"
FRA_AA_Revolution_of_the_old_production_system_desc: "旧军官们依赖个人关系和地方军阀的忠诚来维持补给线，这就像依赖脆弱的血脉。而我们提议的，是建立一个钢铁般的、由计划驱动的全国性补给导管系统。要通过与旧官僚控制的工厂进行竟争来证明辛迪加它的优越性。"
FRA_AA_The_Myth_of_Syndicalism_desc: "我们将再度唤醒无产阶级的直觉能力，迈向工团主义最终的胜利"
FRA_Organizing_large_scale_suppression_desc: "对于这些犹太布尔什维克与犹太共济会分子，没有什么好谈的，必须尽一切手段铲除他们"
FRA_Meeting_with_the_President_desc: "如今的动乱局面，我们政府的存续则完全取决于军方的态度。总理必须与福煦进行会谈一确保军方的支持"
FRA_Refusing_Pity_desc: "对敌人的仁慈便是对自己的伤害。我们理应放弃自己的一切怜悯。动员一切到捍卫工团主义的战斗之中"



