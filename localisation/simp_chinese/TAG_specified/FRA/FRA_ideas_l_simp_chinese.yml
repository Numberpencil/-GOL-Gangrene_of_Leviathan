# 理念描述
#FSA_generic_idea_desc: "理念描述"
FRA_The_deep_pain_of_the_defeated_desc: "当听闻可耻的停战协约签订时，每个法国人心中皆是不甘愤恨以及疯狂，一向被视作高傲的民族自尊心今日却被彻底的被他们肆意地踩在脚底，乌云笼罩了整个法国，我们只能用双眸死死盯着条约并试图记住每一字，看着那一切……士兵与妻儿紧紧相慰，工人与农民在报纸中唾骂这一切，没有什么比这一天更让人印象深刻，麦田倒向坦克经过的方向，辉煌的宫市已成过去残垣断壁的废墟充斥街巷，法兰西母亲早已伤痕累累，我们终不会忘记那耻辱的时刻，必定要让邪恶的德国人付出应有的代价"
FRA_Licking_industrial_scars_desc: "世界大战毁灭性的破坏无疑使本就落后的工业进一步走向崩溃，大战和内战造成的损失无疑需要数代人的重建方能重建辉煌，而如今尽管法国之工业依旧落后但也正在无数个发展计划中大步踏前"
FRA_General_Agreement_of_Martinique_desc: "长久的经济萧条令所有人意识到不可坐以待毙下去，军政府统治时期的到来则开启了新时代，在政府的干预下劳资谈判被摆上台面，一系列宏大的经济计划也如雨后春笋般涌现，马提尼翁宫中获得通过的草案不在少数，大笔经济支出令各行各业焕发生机，时至今日国防政府的经济总量已超越战前且不断向前。"
FRA_Vengeful_Roar_desc: "当军人们经历惨败后，国内先一步投降之时，不甘便爬满了他们的身躯，“刀芒在背”式的理论宣传更深深影响着他们，他们是政府最血腥的屠刀，是那场暴乱中的主角，是制造混乱的代表，或许有人认为他们可以利用，但只有他们自己知道他们自大战后一成未变……布郎热式的狂热刺激着他们，而其所渴望的只有战争，也唯有战争！"
FRA_The_Shame_of_Longvi_Burier_desc: "世界大战的惨败不仅给我们带来了精神上的羞辱更给我们带来了物质上毫不留情的掠夺，庞大的战争赔款，被剥夺的矿产物资正无时无刻侵蚀着疲惫的法兰西。尽管赔款之问题已经暂时因政府的强力态度得到解决，但自德国占领隆维-布里埃矿区之后法国便一直饱受缺乏矿物的问题，这不仅严重阻碍了我们的现代化进程更迫使我们花费大量精力进口铁矿。无论如何，这个问题必须解决，否则法兰西永无出路……"
FRA_Fuhrer_law_desc: "新共和国刚刚新生便咽下了最后一口气。没有葬礼，没有悼词，其至没有人为它合上眼睛。拉加代尔借一纸法案和军队的支持便完成了独裁之事：让法国人不再幻想还有另一种选择，国民议会仍在开会，但日渐沦为装点门面的道具，一切世纪决策都将由元首和其核心团体决定。法律仍在颁布，但已无人追问来源。从今往后，法兰西只有一个声音、一个意志、一个方向。向您致敬，元首。"