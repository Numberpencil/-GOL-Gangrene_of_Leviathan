l_simp_chinese:
FRA.1.t: "德斯佩雷之死"
FRA.1.d: "德斯佩雷作为欧洲最有权势的将军，在其统治法国期间推动了法国在税制等方面的诸多改革。把法国从内战的深渊中拉了起来，并有力打击了犹太布尔什维克安图联合共济会统治法国的阴谋。\n但无可置疑的是将军已经太老了，其身体已然不能再支持他继续统治法国以及压制反对派。而这种情况正在不断加剧，应付军队内部反对的呼声以及反政府组织已经让将军精疲力竭。\n最终在一天早上，德斯佩雷在椅子上永久地闭上了眼睛"
FRA.1.a: "俱往矣"
FRA.2.t: "应对之策"
FRA.2.d: "德斯佩雷的死亡在军队内部掀起了轩然大波，尽管德斯佩雷在临死前已经在备忘录定下了再度民主化的方针，但是对于人事等方面的详细内容仍未定下来，这导致了技官政府和军队内部就临时总统的人选产生了质疑\n技官政府支持达尔朗这一民主派军官担任临时总统。而军方则强势的提议让年迈且已经在军队退役并且已经暂时接替德斯佩雷的福煦元帅担任临时总统，最终库方以强烈的压力迫使技官政府同意了军方的要求。"
FRA.2.a: "那就让福煦来吧"
FRA.2_1.t: "再民主化？"
FRA.2_1.d: "福煦遵照了备忘录的记录以及德斯佩雷的意志召开了一场特别委员会并且做出了再民主化的最终决定。\n而这一条消息也迅速传播下去在法国引起了疯传。无数人都知道机会来了。\n而伴随而来的技术压抑机极致后爆发的狂热。整个法国因为这一消息全社会陷入了巨大的政治动荡，尽管军政府迅速调遣了治安部队进行压制。但其破坏力仍在显现。"
FRA.2_1.a: "糟糕透了"
FRA.3.t: "工团主义的力行者-工团行动党"
FRA.3.d: "拉加代尔是法国工团主义运动中的异类。当大多数工团主义者相信“总罢工”和“工人自治”时，他早已走向了另一条路——民族主义。不是保守派的民族主义，而是一种从工团主义士壤里长出来的、把“阶级”换成“民族”的变种。\n他的理论源头是索雷尔。索雷尔说“无产阶级暴力是神话”，拉加代尔把它改成了“法兰西的复兴是神话”。索雷尔晚年向右转，拉加代尔跟得更远。1920年代，他创办《工团主义革命》杂志吸引了一批对国际主义失望、对共产国际厌恶、对“输出革命”不感兴趣的工团干部。他们的口号是：“先救法国，再谈革命。\n随着拉加代尔成为了法兰西总工会的最高领导人，其组织规模在内战与内战后迅速扩大，老兵，工人与知识分子乃至于金融家都对这个另类的组织产生了极大的兴趣，最终这个工团主义的组织在吸纳了内战后逃亡的各左翼势力以及各阶层可争取的力量之后逐渐压过了法兰西火十字成为了法国规模最大且最具影响力的组织。\n拉加代尔的崛起吸引了法国军方的兴趣，最终在经过谈判之后拉加代尔将组织改组为法兰西工团行动党并且在政府中谋得了一席之位，最为成功的则是得到了政府的承认并且获得了军方的支持。而在德斯佩雷去世的当下，无疑会成为抉择法国命运的重要势力"
FRA.3.a: "已了解"
FRA.3.b: "了解法共"
FRA.3.c: "了解人民阵线"
FRA.3.e: "更多"
FRA.4.a: "已了解"
FRA.4.b: "了解人民党"
FRA.4.c: "了解共和联盟"
FRA.4.d: "更多"
FRA.5.a: "已了解"
FRA.5.b: "了解青年爱国者"
FRA.5.c: "了解农民联盟"
FRA.5.d: "更多"
FRA.6.a: "已了解"
FRA.6.b: "了解工人国际支部"
FRA.6.c: "返回"
FRA.7.t: "务实主义的选择-法兰西共产党"
FRA.7.d: "1920年图尔大会，多数派投票加入共产国际，法国共产党由此诞生。马塞尔·加香是这场分裂的核心人物，从那时起，他便将法共牢牢绑定在伊斯坦布尔的路线上。\n而随后而来的法国内战，则将法共推上了风口浪尖。其联合其他革命派掀起了革命并且逐步扩大自己的影响力。但随着军政府在内战中的得胜，法共元气大伤。后来多列士接替了加香的位置并且改变了暴力革命的总策略，因为这对于军政府无异于以卵击石。\n而在此之外他们也逐渐与布鲁姆的社会激进党领导的人民阵线愈发靠拢。因为他们坚信德斯佩雷的死给他们带来了新的机遇。而只有联合起来才能把握这个机遇"
FRA.7.a: "已了解"
FRA.8.t: "脆弱的联盟-人民阵线"
FRA.8.d: "布鲁姆作为一个民主主义者在内战后逐渐接起了社会激进党的大任，这一政党曾经在大战前风光无限，但是伴随着共和国的崩溃与军政府的建立社会激进党的阶级基础逐步遭到蚕食。\n而如今的社会激进党无疑与法共一样只能论为地下政党筹划行动。但在此之外布鲁姆也逐渐联合起来更多的民主人士扩大自己的规模，并且在越来越动荡的局势的情况下与其他民主团体和党派达成了联盟。而现在这一极具生命力与活力的党派将在这个动荡的局势下发出自己的声音"
FRA.8.a: "返回"
FRA.9.t: "奇美拉-人民党"
FRA.9.d: "他本是共产党的明日之星。二十年代，他是最年轻的市长，是反殖民战争的英雄，是工人运动里最能演讲的那张嘴。共产国际甚至考虑过让他进主席团。然后他去了共产国际，看清了真相，回来就决裂了。他不相信共产国际了。\n1932年，他创办法兰西人民党。名字像左翼，衣服像右翼，骨子里是权力。他的理论是缝合怪：工人的反资本右翼的反犹民族主义的复仇领袖崇拜的组织形式。多里奥不在乎逻辑自洽，他只在乎能不能用。能用就行。他的支持者不是工人，不是农民，是那些被时代甩下来的人-一破产的小店主、退伍的老兵、读了大学找不到工作的年轻人。他们不知道自己要什么，但知道自己不要什么：不要工团，不要共产党，不要犹太人，不要现在这个烂透了的法国。"
FRA.9.a: "返回"
FRA.10.t: "民主主义的末路-共和联盟"
FRA.10.d: "共和联盟是第三共和国最古老的右翼政党，根植于地方名流、天主教温和派和工业资本。他们不信街垒，不信枪杆子，只信一件事：选票。只要议会还在，只要投票箱还能打开，他们就有机会。\n路易·马兰是这种信念的最后化身。这个永远穿深色西装的男人，在1936年看起来像上个世纪的人。他不搞准军事组织，不喊极端口号，甚至很少激动。他的武器是议会程序、预算修正案和不信任动议。\n但武器已经生锈了。\n德斯佩雷的军靴踩碎了议会，建立了军政府。民主成为空谈。左翼党派遭到清算与镇压。\n马兰没有流亡，没有抵抗，也没有投降。他深知如今的他们毫无能力左右后德斯佩雷时代，只是说了一句意味深长的话\n“那就等。等他们把一切搞砸的时候，人民会想起还有我们。"
FRA.10.a: "返回"
FRA.11.t: "坚定的独裁拥护者-青年爱国者"
FRA.11.d: "30年代初泰坦热从保守派的青年组织里拉出了一批人。成立了“青年爱国者”。他们的口号是：“秩序、责任、法兰西。”\n泰坦热是个商人，香槟酒商。他办组织的方式像办企业—有目标、有考核、有制服。青年爱国者的成员穿蓝色衬衫，戴贝雷帽，胸前别着法兰西地图形状的徽章。他们不喜欢议会，不喜欢工会，不喜欢一切“拖累国家效率”的东西。他们的理想是一个“强政府、小议会、大军队”的法兰西。\n德斯佩雷上台时，泰坦热是最早表示支持的文职领袖之一，军方给了他活动空间，他帮军方搞青年训练营、街头巡逻和反颠覆情报。作为回报，青年爱国者成了军政府时期少数被允许公开活动的非军方组织。\n但泰坦热不满足于当军方的配角。他在等一——等德斯佩雷死，等军方内订，等一个“文职强人”出现的时机。拉加代尔的崛起，是他看到了机会。青年爱国者的制服和工团党的红黑旗走在一起，乍看有点不搭，但泰坦热不在乎颜色，他只在乎权力。"
FRA.11.a: "返回"
FRA.12.t: "投机主义-农民联盟"
FRA.12.d: "1934年，他在布列塔尼的田野里拉起“绿衫军一不是红旗，不是三色旗，是绿色的，土地的颜色。农民联盟不是政党，多热尔嫌政党太脏。他的组织是“运动”，是穿绿衫的农民在乡镇集市上的呐喊：“城市管好你们自己，土地是我们的。\n大萧条让农产品价格跌了一半，巴黎的政客们还在吵架。多热尔的方案简单粗暴：食，一分不能少。政府按成本价收粮，左翼说他是反动派，右翼说他是经济文盲德斯佩雷的军政府需要粮食，多热尔需要价格保护，双方做了几年生意。而现在，他正逐渐朝着拉加代尔靠拢"
FRA.12.a: "返回"
FRA.13.t: "随之任之-工人国际支部"
FRA.13.d: "1905年，让·饶勒斯把法国的社会主义者捏在了一起，取名“工人国际法国支部”。那时候它是欧洲最强的社会主义政党，是第二国际的明珠，是所有向往“和平过渡”的工人的家。饶勒斯被刺杀了，但他的党活了下来。1936年，这个党还活着，但已经不像活着了。\n工团主义者用总罢工和街垒抢走了工人阶级的忠诚。布鲁姆带着一批骨干出去搞人民阵线。共产党在左翼虎视眈眈，等着收编所有不满的人。保罗·富尔接手的是一个空壳——议会里有席位，但议会已经被军政府解散过；工会里有关系，但工会已经被工团党接管了：党员还在交党费，但很多人已经在打听工团党的入会流程。\n富尔不是饶勒斯，也不是布鲁姆。他是个忠实的党务官僚，擅长写决议、主持会议、在派系之间走钢丝。但钢丝下面已经没有观众了。"
FRA.13.a: "返回"
FRA.14.t: "工团胜利"
FRA.14.d: "随着举世瞩目的投票开始，所有党派都紧张握住了手不安的期待着投票箱的结果并竭尽全力为自己拉取选票，最终伴随着选举日的结束最终的结果出来了。\n工团党取得了40%的票数无可置疑的在议会获得了优势性的议会席位，而随后临时总统任命拉加代尔为总理开始商讨政府的组织。\n拉加代尔——这位曾经的工会组织者、索雷尔主义的忠实信徒，在无数火炬的照耀下，登上了巴黎市政厅的台阶。他的演讲没有过多的华丽辞藻，只有钢铁般的铿锵：“从今天起，法兰西将是一个伟大的国家，每一位国民都是它的股东，每一座工厂都是它的堡垒。我们将是一个属于法兰西的民族共同体！”\n工团主义者为此狂欢，工商主，金融家等也为此欢呼，因为曾经向他们私下承诺妥协与让步以及支持他们利益的拉加代尔赢了。他们杜绝了多列士，布鲁姆这些邪恶的马列主义分子侵蚀他们的财产。\n而布鲁姆他们的脸色并不好看，但他们只能吞下恶果再次寻求机会进行反击"
FRA.14.a: "工团，前进"
FRA.15.t: "总统之死"
FRA.15.d: "福熙元帅作为军政府时期的三驾马车之一，他无疑是仅次于德斯佩雷的存在。福熙并不反对德斯佩雷，反而是为其政权保驾护航，在军政府担任治安部部长的他，以强硬手段打击反对分子和工人革命，并协助德斯佩雷维持军方的信任。此外，他有着很多的遗憾，因为军政府繁忙，业务错过了战友的葬礼等等，如果没有什么变动，他们苍老的身体可能会先德斯佩雷而去，他同样感觉自己时日无多，但随着德斯佩雷的突然死亡，福熙元帅作为德斯佩雷下的第一人，凭借自己大战的功绩及在军队内的权威被推上了临时总统的位置，推动法国的在民主化\n虽然福熙元帅厌恶着蛆虫般的第三共和国复辟，但是却仍然主持了全国大选。尽管他一直秘密支持了PDSF\n工团党最后赢了，邪恶的布尔什维克和犹太共济会，没有凭借大选掌控天主教的法国，拉加代尔与自己意见诸多相同之处，让其成为自己所认可的新政权的领导人。在他可以为自己可以歇息片刻之时，随之而来的便是要求重新大选以反对工团党的暴动\n这让福熙元帅最终精疲力尽，苍老的身体最终支撑不住如此巨大的工作量。福熙元帅在一次散步的过程中倒下了\n"
FRA.15.a: "安息吧总统"
#PDSF线
FRA.1_PDSF.t: "骚乱"
FRA.1_PDSF.d: "PDSF（法兰西工团行动党）的胜利被称作大众的胜利，但胜利的余温尚未散尽，对于PDSF的不满已在暗处积蓄……\n来自街头、工会、以及那些在大选中被击败却并未被瓦解的势力，如法国共产党因大选的失利在其党派内部便产生了一次变动，主张直接行动的一派掌握了话语权。法共开始组织旗下的工会力量，在各主要工业城市发动游行与示威。布鲁姆和他的盟友们在议会斗争中投入了太多资本，不愿轻易将其兑换为街头政治……但当法共的抗议规模持续扩大，大选失利的人民阵线在面临的当下也不得不选择与法共进一步接触，拉加代尔的优势性地位、以及他的民粹与法西斯倾向向他们表明了“议会斗争”的荒唐，他们必须在一切尚未尘埃落定之前，将重心转移——拉加代尔必须下台。\n其他反对派系在看见抗议产生了效果后，这些观望者迅速做出了同样的判断，没人想成为最后一个站在将倾大厦里的人。这无疑是拉加代尔所面临的巨大挑战，他赢得了一场大选，却发现自己坐在一张尚未安定的椅子上，他必须做出回应——确保自己在政府中的优势地位，否则，他所面临的将不是在议会中让步……一场决定性的斗争，要么拥有一切，要么一无所有。"
FRA.1_PDSF.a: "工团行动党不会低头！"
FRA.1_PDSF.a_desc: "我们将在街头发表强硬的演说进行反击，我们绝不能妥协，但军方不愿看到政府主动激化矛盾，反对派会因为政府的强硬态度而将政府视作为共同敌人。§R确保政权控制度不要太低，压制住反对派行动，控制住他们的规模使其不要太高导致引起政府军方质疑，否则拉加代尔将面临倒台的风险§!……注意，目前版本法国只制作了工团行动党路线，建议先存个档！如果进入了其他路线的入口不会有内容。"
FRA.3_PDSF.t: "颁布紧急戒严令"
FRA.3_PDSF.d: "上午九时，拉加代尔步入议会。他没有携带演讲稿，只从内袋抽出一张对折的纸，在演讲台上对议员进行演讲\n法案全文不足六百字，核心条款有三项：授权政府对妨害公共生产秩序者实施预防性拘留，期限最长一年：所有出版物及集会须提前七日向国家工团宣传部报备：设立特别法庭审理涉嫌怠工与煽动案件，一审终审，不得上诉，法案有效期两年，期满前三十日由内阁决议是否续期。\n在一阵喧哗过后，PDSF的议员开始对此鼓掌强烈称赞拉加代尔是整个法兰西的救星，他正避免邪恶的布尔什维克赢得这场斗争。随后许多的担忧骚乱会导致法兰西走上社会主义道路的强硬右翼分子都紧跟着开始鼓掌。\n最后该法案于当日被紧急颁布，对于反PDSF派来说他们的失败已经注定了..."
FRA.3_PDSF.a: "早该如此了"
FRA.4_PDSF.t: "颁布元首法"
FRA.4_PDSF.d: "国民议会的气氛与往日不同。旁听席坐满了灰制服青年，走廊里每隔五步便有一名工团行动队员。议员们入场时被要求通过安检——这是历史上第一次。\n拉加代尔在十时整登台，他没有穿往常的工团制服，而是一身深灰色的西装，他进行了十七分钟演讲，没有激昂的语调，没有挥舞的手臂。他仿佛只是在无情陈述着一个事实：\n紧急戒严取得了成效，但它是临时性的。临时性意味着不确定性，不确定性意味着灾难。法国的重建需要确定性，需要一个不会因换届或派系斗争而中断的最高权威，因此，有必要将紧急状态”从临时措施升格为常设制度。此外将最高权力授予自已这个全法国的代表人而非所谓的临时总统，总统在共和国的无能是众所周知的，我们必须将总统与总理的权柄合二为一。\n\n尽管议会有许多人对此感到不满，但是最终也无话可说，除此之外更有许多的中右翼分子对此感到兴奋与激动，他们对于一个独裁之国的憧慢与民主政体的反感更让他们讯速靠拢到了支持拉加代尔的队伍里。国内骚乱已经被终结，而拉加代尔并借此笼络到了军队的支持，无可置疑的说拉加代尔现在已经是实质上的统治者了，目前的他只是需要一个流程与形式确保自己的绝对地位。"
FRA.4_PDSF.a: "向您致敬，元首！"
FRA.5_PDSF.t: "改组革命卫队"
FRA.5_PDSF.d: "如今由全劳联和法兰西工团党为基础组建的冲锋队正面临许多难题。无论是冲锋队组建体系不完善，还是规模的日益庞大，都是如今的冲锋队急需改革，而1935年的政治动乱使其进一步证明了改革的迫切，因此我们现在必须将其提上日程"
FRA.5_PDSF.a: "扩大规模"
FRA.5_PDSF.b: "确保卫队忠诚"
FRA.6_PDSF.t: "军方担忧"
FRA.6_PDSF.d: "自拉加代尔上台以来，反对派运动层出不穷，好似要将拉加代尔彻底从总理的位置上驱赶下来，而拉加戴尔对于暴动事件的处理也未曾让军方感到满意，以至于远在西班牙充当驻西大使的贝当元帅也向拉加代尔表达了对于法国暴动愈演愈烈的不满\n拉加代尔同样坐在办公桌里，一脸沉思与不安的思考着应对举措与安抚军方，因为他十分清楚，刚刚上台，自己没有能力与军方摊牌和在没有军方支持的情况下，巩固自己的政治地位"
FRA.6_PDSF.a: "想办法安抚军方吧"
FRA.7_PDSF.t: "大罢工"
FRA.7_PDSF.d: "拉加代尔，应对抗议活动的手段似乎略显拙劣了，他并没能彻底镇压反对派，使得原先部分的工人支持者和其他工人感到愈发不满，混乱的政治导致了物价增长以及社会动荡，使他们的生活愈发艰难。\n面对此等场景，工人们自然选择了抗议，要求提高自身待遇及福利。但是，在这一混乱时期，提出如此要求，自然被地方的行政长官，雇主以及警察部门视作暴乱的预演受到打击\n在这种不断遭到屈辱以及自身越来越恶化的生活环境影响下，忍无可忍的工人最终选择了响应法共反对专制的工团党以及呼吁重新选举及提高工人待遇的呼吁，在法国各地掀起了1935年以来第一次大规模的革命"
FRA.7_PDSF.a: "给我停下！"
FRA.8_PDSF.t: "毫无仁慈"
FRA.8_PDSF.d: "午夜零时在拉加代尔的要求与施压下，各省省长都用行政权力宣布进入紧急状态与此同时，放开了对警察部门的控制，并与当地的驻军寻求合作，对革命的恐惧已经压倒了大部分军政府时期的官员，他们支持民主过渡，但绝非希望法国共产党社会党一类的左翼政党上台，固然德斯佩雷时期曾对金融资本家和企业家进行了压制，并通过了税收改革，但显然远不及左翼对他们造成的威胁，\n在几天的戒严中，全国逮捕了数百名较有影响的煽动者，其中也不乏不满拉加戴尔的右翼分子，在这次风波之后，愈演愈烈的全国性暴动被暂时遏制，而在法庭上则有无数人以颠覆罪名受到判决"
FRA.8_PDSF.a: "干的不错"
FRA.9_PDSF.t: "街头的血"
FRA.9_PDSF.d: "贝尔维尔的路面被撬开了，先锋队的队员们扛起铁栅栏和废弃的电车底牌。在梅尔尼蒙当街构筑了四道街垒 法共街垒在后，相隔三条巷子，双方中间夹着一条无人区，满地都是碎玻璃和被踩烂的传单，\n枪声从晚上9点开始，零星响起，11点1发，猎枪弹打穿了街垒上的红旗，之后便是互相对射治安队手中持着从退伍兵手里弄来的mas步枪，法贡这边则是老式的勒贝尔和三把手枪，凌晨两点，一名19岁的冲锋队纠察队员倒在排水沟旁，血液流入下水道口，直至凌晨四人死亡，11人重伤，\n而部分罢工的工人自发向里昂市政厅进攻，占领者是一支由印刷工，化学厂技工和索恩河码头的装卸工组成的混合队伍没有统一指挥，使得最终这支毫无组织的罢工队伍被赶来的警察部队镇压，\n马赛港口的冲突扩散的更加激烈，原本局限在老港区的罢工对峙因一辆误闯街垒的邮车被袭击，演变成防暴警察与码头工人间的全面冲突，老港的鱼市关闭了鱼贩们把冰柜推到街上当做掩体，\n拉加代尔收到了数份矛盾加剧的报告，他什么都没有说，只是打了一个电话"
FRA.9_PDSF.a: "警察与地方民兵就足够了"
FRA.9_PDSF.b: "打电话给总统吧"
FRA.9_PDSF_a.t: "军方接受"
FRA.9_PDSF_a.d: "总理给总统打了一个电话，请求军方的介入。总统沉默了许久，最后还是同意了"
FRA.9_PDSF_a.a: "很好"
FRA.9_PDSF_b.t: "军方拒绝"
FRA.9_PDSF_b.d: "拉加代尔打电话给福熙，请求军方介入，帮助遏制罢工，自己这边也会想办法安抚不满的工人与支持者，但总统只是用近乎愤怒的语气表示，你们工团党真是一群废物，连罢工和暴徒都镇压不了，军方对你们十分不满，如果你们在有限的时间内没能处理的好，就不要指望军方的善后与处理，拉加戴尔从中听出了军方只负责处理善后问题的语调，看来寻求军方的支持失败了，拉加代尔长舒了一口气后点了根烟，没有人知道后来发生了什么，只知道他一整天都没有离开过办公室"
FRA.9_PDSF_b.a: "该死"
FRA.10_PDSF.t: "一切，或一无所有"
FRA.10_PDSF.d: "拉加代尔失败了，他压制反对派的一切手段都失败了，工团党内部也因为暴乱而分崩离析，如此混乱的局势，让军方感到极度愤怒。军方再次施压，要求如果处理不了，就将权力让渡给军方"
FRA.10_PDSF.a: "辞职吧"
FRA.10_PDSF.b: "让军方来吧"
FRA.11_PDSF.t: "人民阵线"
FRA.11_PDSF.d: "法国的政治危机近日出现了戏剧性转折拉加代尔今晨宣布辞职，并呼吁通过大选将权力移交给人民阵线，以避免军方全面接管国家\n九时整，爱丽舍宫发言人宣读了一份简短声明，拉加戴尔在声明中承认，持续长久的罢工浪潮和街头冲突已经超出了文官政府的控制能力。为避免军队介入造成更大伤亡，其表示，宣布辞职并提前启动大选程序，由人民阵线组建过渡政府\n消息传出后，巴黎街头出现了数日来的首次平静，街垒开始拆除，高炉里重新喷出蒸汽，工人们坐在路边抽烟，等待下一步指令\n人民政线领袖莱昂布鲁姆在午间在人民报的编辑部露面，在接受记者采访时表示，我们接受这一责任，法国的出路不在于坦克的车轮之下，而在于投票箱前。他呼吁各党派保持克制，以确保选举如期举行\n福熙元帅对此表示沉默，总参谋部下午发布了一份简短的书面声明，称陆军尊重宪政程序，暂不采取行动，据有关人士透露，军方内部目前存在重大分歧，部分年轻军官主张应当立即接管政府，但资深将领则倾向于观望选举结果\n英国外交部对此表示谨慎欢迎，德国方面则尚未作出正式评论，去柏林的消息也是称希特勒宰相，对此松了一口气。因为一个民族主义的疯子暂时滚蛋了"
FRA.11_PDSF.a: "民主的的胜利"
FRA.12_PDSF.t: "人民阵线"
FRA.12_PDSF.d: "斐迪南.福熙元帅今日凌晨以临时总统身份接管政权，宣布全国进入戒严状态。前任总理拉加代尔在荣军院被召见后签署辞职书，随后用装甲车护送前往枫丹白露宫，\n凌晨四时，坦克驶入协和广场，步兵接管了爱丽舍宫，内政部及各大报社，福熙总统签署第1号戒严令，规定巴黎，里昂，马赛进入军管状态。宵禁期间，格杀勿论，军事法庭对煽动者具有即决裁判权，贝尔维尔社员墙前传出排枪声，六名工团骨干被处决。里昂市政厅被夺回，数百名占领工人被押往军营，马赛港区的交火，导致了至少11人死亡。军事法庭在卡车上就地审判每起案件的审判时长不足三分钟，\n人民阵线核心领袖布鲁姆在住所遭囚禁，英国方面对此表示密切关注，德国对此表示祝贺，美国方面则不予置评，\n巴黎街头寂静如此，一名老妇对记者说，上次这么安静，是1920年"
FRA.12_PDSF.a: "可笑的“民主”"
FRA.13_PDSF.t: "反抗的烽火"
FRA.13_PDSF.d: "塞纳-圣但尼的风向变了，比尔昂科托的那家雷诺外包厂最先停机，气体拉到第三声时，铸铁车间的屋顶升起了红布，由女工缝制的针脚歪，但足够鲜艳，午后传去圣但尼的炼焦厂，再到布洛涅/比昂古的旧船坞，整个昼夜，七家千人大厂陷入停摆\n法共的干部比警察率先赶到，他们抓住了工人因国内政治动荡和工人场主不愿妥协的契机，开始煽动和组织他们参与到政治抗议\n而在布鲁姆那边，社会党发布了通篇大论来谴责拉加代尔的暴力统治与镇压和对议会共和国的亵渎，这一社论引起了左右翼反拉加代尔势力的支持，这些文章如同火柴一样进一步点燃了反垃圾戴尔派的情绪。尽管拉加戴尔在大选中得到了多数票，但反对者同样不在少数\n政府那边还没有动静，但工团党内部的召开的党代会延长到了5点"
FRA.13_PDSF.a: "放任不管"
FRA.13_PDSF.b: "大力镇压"
FRA.14_PDSF.t: "布鲁姆的选择"
FRA.14_PDSF.d: "塞纳-尽管布鲁姆做出了大力谴责拉加代尔与法兰西公团行动党的行动，但是对于社会党内部更加激进的势力，与其他左派团体来说，这仍然还不够。\n布鲁姆领导的社会党是在军政府时期地下反对党里面规模最强的一个所有人都迫切希望布鲁姆彻底担当起人民联盟领导者的责任\n对于布鲁姆来说，在大选中，拉加代尔以优势票数击败自己以来这个联盟就将不可避免的走向崩溃，但是联盟内部的团体不甘于如此，就再次屈服于拉加代尔，因而选择通过暴乱的形式试图动摇拉加代尔的根本，比起退让而重新组织大选，而自己也通过社会党的媒体抨击拉加代尔\n但是法国现在的政治局势，似乎向激化进一步演变，而内部的压力不断催促与推动着布鲁姆。最终，布鲁姆妥协了"
FRA.14_PDSF.a: "战斗吧"

