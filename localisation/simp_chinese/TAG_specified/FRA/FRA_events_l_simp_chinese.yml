 FRA.7.t:0 "务实主义的选择-法兰西共产党"
 FRA.7.d:0 "1920年图尔大会，多数派投票加入共产国际，法国共产党由此诞生。马塞尔·加香是这场分裂的核心人物，从那时起，他便将法共牢牢绑定在伊斯坦布尔的路线上。\n而随后而来的法国内战，则将法共推上了风口浪尖。其联合其他革命派掀起了革命并且逐步扩大自己的影响力。但随着军政府在内战中的得胜，法共元气大伤。后来多列士接替了加香的位置并且改变了暴力革命的总策略，因为这对于军政府无异于以卵击石。\n而在此之外他们也逐渐与布鲁姆的社会激进党领导的人民阵线愈发靠拢。因为他们坚信德斯佩雷的死给他们带来了新的机遇。而只有联合起来才能把握这个机遇"
 FRA.7.a:0 "已了解"
 FRA.8.t:0 "脆弱的联盟-人民阵线"
 FRA.8.d:0 "布鲁姆作为一个民主主义者在内战后逐渐接起了社会激进党的大任，这一政党曾经在大战前风光无限，但是伴随着共和国的崩溃与军政府的建立社会激进党的阶级基础逐步遭到蚕食。\n而如今的社会激进党无疑与法共一样只能论为地下政党筹划行动。但在此之外布鲁姆也逐渐联合起来更多的民主人士扩大自己的规模，并且在越来越动荡的局势的情况下与其他民主团体和党派达成了联盟。而现在这一极具生命力与活力的党派将在这个动荡的局势下发出自己的声音"
 FRA.8.a:0 "返回"
 FRA.9.t:0 "奇美拉-人民党"
 FRA.9.d:0 "他本是共产党的明日之星。二十年代，他是最年轻的市长，是反殖民战争的英雄，是工人运动里最能演讲的那张嘴。共产国际甚至考虑过让他进主席团。然后他去了共产国际，看清了真相，回来就决裂了。他不相信共产国际了。\n1932年，他创办法兰西人民党。名字像左翼，衣服像右翼，骨子里是权力。他的理论是缝合怪：工人的反资本右翼的反犹民族主义的复仇领袖崇拜的组织形式。多里奥不在乎逻辑自洽，他只在乎能不能用。能用就行。他的支持者不是工人，不是农民，是那些被时代甩下来的人-一破产的小店主、退伍的老兵、读了大学找不到工作的年轻人。他们不知道自己要什么，但知道自己不要什么：不要工团，不要共产党，不要犹太人，不要现在这个烂透了的法国。"
 FRA.9.a:0 "返回"
 FRA.10.t:0 "民主主义的末路-共和联盟"
 FRA.10.d:0 "共和联盟是第三共和国最古老的右翼政党，根植于地方名流、天主教温和派和工业资本。他们不信街垒，不信枪杆子，只信一件事：选票。只要议会还在，只要投票箱还能打开，他们就有机会。\n路易·马兰是这种信念的最后化身。这个永远穿深色西装的男人，在1936年看起来像上个世纪的人。他不搞准军事组织，不喊极端口号，甚至很少激动。他的武器是议会程序、预算修正案和不信任动议。\n但武器已经生锈了。\n德斯佩雷的军靴踩碎了议会，建立了军政府。民主成为空谈。左翼党派遭到清算与镇压。\n马兰没有流亡，没有抵抗，也没有投降。他深知如今的他们毫无能力左右后德斯佩雷时代，只是说了一句意味深长的话\n“那就等。等他们把一切搞砸的时候，人民会想起还有我们。"
 FRA.10.a:0 "返回"
 FRA.11.t:0 "坚定的独裁拥护者-青年爱国者"
 FRA.11.d:0 "30年代初泰坦热从保守派的青年组织里拉出了一批人。成立了“青年爱国者”。他们的口号是：“秩序、责任、法兰西。”\n泰坦热是个商人，香槟酒商。他办组织的方式像办企业—有目标、有考核、有制服。青年爱国者的成员穿蓝色衬衫，戴贝雷帽，胸前别着法兰西地图形状的徽章。他们不喜欢议会，不喜欢工会，不喜欢一切“拖累国家效率”的东西。他们的理想是一个“强政府、小议会、大军队”的法兰西。\n德斯佩雷上台时，泰坦热是最早表示支持的文职领袖之一，军方给了他活动空间，他帮军方搞青年训练营、街头巡逻和反颠覆情报。作为回报，青年爱国者成了军政府时期少数被允许公开活动的非军方组织。\n但泰坦热不满足于当军方的配角。他在等一——等德斯佩雷死，等军方内订，等一个“文职强人”出现的时机。拉加代尔的崛起，是他看到了机会。青年爱国者的制服和工团党的红黑旗走在一起，乍看有点不搭，但泰坦热不在乎颜色，他只在乎权力。"
 FRA.11.a:0 "返回"
 FRA.12.t:0 "投机主义-农民联盟"
 FRA.12.d:0 "1934年，他在布列塔尼的田野里拉起“绿衫军一不是红旗，不是三色旗，是绿色的，土地的颜色。农民联盟不是政党，多热尔嫌政党太脏。他的组织是“运动”，是穿绿衫的农民在乡镇集市上的呐喊：“城市管好你们自己，土地是我们的。\n大萧条让农产品价格跌了一半，巴黎的政客们还在吵架。多热尔的方案简单粗暴：食，一分不能少。政府按成本价收粮，左翼说他是反动派，右翼说他是经济文盲德斯佩雷的军政府需要粮食，多热尔需要价格保护，双方做了几年生意。而现在，他正逐渐朝着拉加代尔靠拢"
 FRA.12.a:0 "返回"
 FRA.13.t:0 "随之任之-工人国际支部"
 FRA.13.d:0 "1905年，让·饶勒斯把法国的社会主义者捏在了一起，取名“工人国际法国支部”。那时候它是欧洲最强的社会主义政党，是第二国际的明珠，是所有向往“和平过渡”的工人的家。饶勒斯被刺杀了，但他的党活了下来。1936年，这个党还活着，但已经不像活着了。\n工团主义者用总罢工和街垒抢走了工人阶级的忠诚。布鲁姆带着一批骨干出去搞人民阵线。共产党在左翼虎视眈眈，等着收编所有不满的人。保罗·富尔接手的是一个空壳——议会里有席位，但议会已经被军政府解散过；工会里有关系，但工会已经被工团党接管了：党员还在交党费，但很多人已经在打听工团党的入会流程。\n富尔不是饶勒斯，也不是布鲁姆。他是个忠实的党务官僚，擅长写决议、主持会议、在派系之间走钢丝。但钢丝下面已经没有观众了。"
 FRA.13.a:0 "返回"
 FRA.14.t:0 "工团胜利"
 FRA.14.d:0 "随着举世瞩目的投票开始，所有党派都紧张握住了手不安的期待着投票箱的结果并竭尽全力为自己拉取选票，最终伴随着选举日的结束最终的结果出来了。\n工团党取得了40%的票数无可置疑的在议会获得了优势性的议会席位，而随后临时总统任命拉加代尔为总理开始商讨政府的组织。\n拉加代尔——这位曾经的工会组织者、索雷尔主义的忠实信徒，在无数火炬的照耀下，登上了巴黎市政厅的台阶。他的演讲没有过多的华丽辞藻，只有钢铁般的铿锵：“从今天起，法兰西将是一个伟大的国家，每一位国民都是它的股东，每一座工厂都是它的堡垒。我们将是一个属于法兰西的民族共同体！”\n工团主义者为此狂欢，工商主，金融家等也为此欢呼，因为曾经向他们私下承诺妥协与让步以及支持他们利益的拉加代尔赢了。他们杜绝了多列士，布鲁姆这些邪恶的马列主义分子侵蚀他们的财产。\n而布鲁姆他们的脸色并不好看，但他们只能吞下恶果再次寻求机会进行反击"
 FRA.14.a:0 "工团，前进"
 #PDSF线
 FRA.1_PDSF.t:0 "骚乱"
 FRA.1_PDSF.d:0 "pdsf的胜利尽管可以说是大众的胜利，但是对于pdsf的不满正在与日俱增。如法国共产党因大选的失利在其党派内部便产生了一次变动，转而开始组织反对活动对拉加代尔进行施压。而大选失利的人民阵线当下也不得不选择与法共进一步合作，拉加代尔的优势性地位以及他的民粹与法西斯倾向注定了议会斗争的荒唐。\n就在这种情况下法国共产党率先组织了自己工会的工人在各大城市举行游行与示威，而随后其他反对拉加代尔的派系在看见抗议有所成效之后便已经决定了讯速跟进。这无疑是拉加代尔所面临的巨大挑战，他必须巧妙应对方能确保自已在政府中的优势地位，否则拉加代尔无疑将被迫卑躬屈膝"
 FRA.1_PDSF.a:0 "给他们点颜色瞧瞧"
 FRA.3_PDSF.t:0 "颁布紧急戒严令"
 FRA.3_PDSF.d:0 "上午九时，拉加代尔步入议会。他没有携带演讲稿，只从内袋抽出一张对折的纸，在演讲台上对议员进行演讲\n法案全文不足六百字，核心条款有三项：授权政府对妨害公共生产秩序者实施预防性拘留，期限最长一年：所有出版物及集会须提前七日向国家工团宣传部报备：设立特别法庭审理涉嫌怠工与煽动案件，一审终审，不得上诉，法案有效期两年，期满前三十日由内阁决议是否续期。\n在一阵喧哗过后，pdsf的议员开始对此鼓掌强烈称赞拉加代尔是整个法兰西的救星，他正避免邪恶的布尔什维克赢得这场斗争。随后更多的担忧骚乱会让法国走上社会主义道路以及强硬的右翼分子都紧跟着开始鼓掌。\n最后该法案于当日被紧急颁布，对于反pdsf派来说他们的失败已经注定了..."
 FRA.3_PDSF.a:0 "早该如此了"
 FRA.4_PDSF.t:0 "颁布元首法"
 FRA.4_PDSF.d:0 "国民议会的气氛与往日不同。旁听席坐满了灰制服青年，走廊里每隔五步便有一名工团行动队员。议员们入场时被要求通过安检——这是历史上第一次。\n拉加代尔在十时整登台，他没有穿往常的工团制服，而是一身深灰色的西装，他进行了十七分钟演讲，没有激昂的语调，没有挥舞的手臂。他仿佛只是在无情陈述着一个事实：\n紧急戒严取得了成效，但它是临时性的。临时性意味着不确定性，不确定性意味着灾难。法国的重建需要确定性，需要一个不会因换届或派系斗争而中断的最高权威，因此，有必要将紧急状态”从临时措施升格为常设制度。此外将最高权力授予自已这个全法国的代表人而非所谓的临时总统，总统在共和国的无能是众所周知的，我们必须将总统与总理的权柄合二为一。\n\n尽管议会有许多人对此感到不满，但是最终也无话可说，除此之外更有许多的中右翼分子对此感到兴奋与激动，他们对于一个独裁之国的憧慢与民主政体的反感更让他们讯速靠拢到了支持拉加代尔的队伍里。国内骚乱已经被终结，而拉加代尔并借此笼络到了军队的支持，无可置疑的说拉加代尔现在已经是实质上的统治者了，目前的他只是需要一个流程与形式确保自己的绝对地位。"
 FRA.4_PDSF.a:0 "向您致敬，元首！"
