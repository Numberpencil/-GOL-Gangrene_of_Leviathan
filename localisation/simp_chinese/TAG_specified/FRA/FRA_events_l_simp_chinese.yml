l_simp_chinese:
 FRA.1.t:0 "德斯佩雷之死"
 FRA.1.d:0 "德斯佩雷作为欧洲最有权势的将军，在其统治法国期间推动了法国在税制等方面的诸多改革。把法国从内战的深渊中拉了起来，并有力打击了犹太布尔什维克安图联合共济会统治法国的阴谋。\n但无可置疑的是将军已经太老了，其身体已然不能再支持他继续统治法国以及压制反对派。而这种情况正在不断加剧，应付军队内部反对的呼声以及反政府组织已经让将军精疲力竭。\n最终在一天早上，德斯佩雷在椅子上永久地闭上了眼睛"
 FRA.1.a:0 "俱往矣"
 FRA.2.t:0 "应对之策"
 FRA.2.d:0 "德斯佩雷的死亡在军队内部掀起了轩然大波，尽管德斯佩雷在临死前已经在备忘录定下了再度民主化的方针，但是对于人事等方面的详细内容仍未定下来，这导致了技官政府和军队内部就临时总统的人选产生了质疑\n技官政府支持达尔朗这一民主派军官担任临时总统。而军方则强势的提议让年迈且已经在军队退役并且已经暂时接替德斯佩雷的福煦元帅担任临时总统，最终库方以强烈的压力迫使技官政府同意了军方的要求。"
 FRA.2.a:0 "那就让福煦来吧"
 FRA.2_1.t:0 "再民主化？"
 FRA.2_1.d:0 "福煦遵照了备忘录的记录以及德斯佩雷的意志召开了一场特别委员会并且做出了再民主化的最终决定。\n而这一条消息也迅速传播下去在法国引起了疯传。无数人都知道机会来了。\n而伴随而来的技术压抑机极致后爆发的狂热。整个法国因为这一消息全社会陷入了巨大的政治动荡，尽管军政府迅速调遣了治安部队进行压制。但其破坏力仍在显现。"
 FRA.2_1.a:0 "糟糕透了"
 FRA.3.t:0 "工团主义的力行者-工团行动党"
 FRA.3.d:0 "拉加代尔是法国工团主义运动中的异类。当大多数工团主义者相信“总罢工”和“工人自治”时，他早已走向了另一条路——民族主义。不是保守派的民族主义，而是一种从工团主义士壤里长出来的、把“阶级”换成“民族”的变种。\n他的理论源头是索雷尔。索雷尔说“无产阶级暴力是神话”，拉加代尔把它改成了“法兰西的复兴是神话”。索雷尔晚年向右转，拉加代尔跟得更远。1920年代，他创办《工团主义革命》杂志吸引了一批对国际主义失望、对共产国际厌恶、对“输出革命”不感兴趣的工团干部。他们的口号是：“先救法国，再谈革命。\n随着拉加代尔成为了法兰西总工会的最高领导人，其组织规模在内战与内战后迅速扩大，老兵，工人与知识分子乃至于金融家都对这个另类的组织产生了极大的兴趣，最终这个工团主义的组织在吸纳了内战后逃亡的各左翼势力以及各阶层可争取的力量之后逐渐压过了法兰西火十字成为了法国规模最大且最具影响力的组织。\n拉加代尔的崛起吸引了法国军方的兴趣，最终在经过谈判之后拉加代尔将组织改组为法兰西工团行动党并且在政府中谋得了一席之位，最为成功的则是得到了政府的承认并且获得了军方的支持。而在德斯佩雷去世的当下，无疑会成为抉择法国命运的重要势力"
 FRA.3.a:0 "已了解"
