 POR_Sixteen_Years_of_Enslavement: "十六载奴役岁月"
 # 理念描述
 #POR_generic_idea_desc: "理念描述"
  POR_Sixteen_Years_of_Enslavement_desc: "\n\n\n£GFX_idea_banner_POR_Sixteen_Years_of_Enslavement\n\n\n\n\n\n\n1919年大战的惨败，将葡萄牙民族的命运推入了前所未有的深渊。波尔图与里斯本战线的顽强抵抗，终究未能挽救国家的危亡。最终，葡萄牙在美泉宫屈辱地签署了《埃斯特雷马杜拉条约》，正式臣服于西班牙的霸权之下。\n安哥拉、莫桑比克、澳门、几内亚、东帝汶，尽数割让。曾经横跨四大洲的葡萄牙殖民帝国，就此土崩瓦解。辽阔的海疆不再属于葡萄牙，红绿色的旗帜黯然垂落。\n而战后的葡萄牙人民，更不得不忍受西班牙人的铁蹄与奴役。战后的经济萧条如严冬般笼罩山河，工厂倒闭、粮价飞涨，经济崩溃更给葡萄牙的命运蒙上了一层阴影。\n就这样，葡萄牙在屈辱、沉沦与挣扎之中，熬过了漫长的十六年……"

