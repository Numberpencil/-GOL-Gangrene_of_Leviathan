 ROM_The_Rise_of_the_Iron_Guard: "崛起的铁卫团"
 ROM_The_Pain_of_Division: "分裂之痛"
 ROM_The_Pain_of_Division_1: "分裂之痛"
 Uneasy_peasant_movement: "不安的农民运动"
 # 理念描述
 #SAC_generic_idea_desc: "理念描述"
 ROM_The_Rise_of_the_Iron_Guard_desc: "在大战结束以后，以科德里亚努组织的铁卫团逐渐崛起为被分裂的瓦拉几亚王国里面的一股新兴右翼势力，而其权威在农民党自由党等政党领导的宪政体制崩坏以来便进一步增加，而如今的他们正试图策划着一场领导王国的阴谋。"
 ROM_The_Pain_of_Division_desc: "大战后的美泉宫和会所签订的《蒙特尼亚条约》将罗马尼亚王国一分为二，瓦拉几亚王国和摩尔多瓦王国这两大多瑙河公国再度复现，而罗马尼亚的统一之梦也被哈布斯堡无情践踏。1931年的多瑙战争让罗马尼亚人看见了希望但却又被德国人与哈布斯堡联合镇压，如今的罗马尼亚人只能不安且仇恨地看着隔壁的匈牙利王国以及远眺分离的同胞们。"
 Uneasy_peasant_movement_desc: "瓦拉几亚自罗马尼亚王国时期以来的农业问题仍未得到有效解决与缓解，而通过的各种改革法案对农民进行了进一步的压榨。此外《蒙特尼亚条约》规定的对匈赔款则加大了农民本就沉重的负担，农民在铁卫团的领导下展开了声势浩大的反抗运动，而现今的政府如若不处理好这一问题迟早会因农民运动而轰然解散"