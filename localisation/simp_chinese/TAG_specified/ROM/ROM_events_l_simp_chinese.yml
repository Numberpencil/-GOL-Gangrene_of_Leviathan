l_simp_chinese:
 ROM.1.t:0 "匈牙利施压"
 ROM.1.d:0 "啊我操匈牙利怎么这么坏"
 ROM.1.a:0 "我们别无选择"
 ROM.2.t:0 "进军布加勒斯特"
 ROM.2.d:0 "不管风吹浪打，\n胜似闲庭信步！"
 ROM.2.a:0 "铁卫团前进！"
 ROM.3.t:0 "来自匈牙利的最后通牒"
 ROM.3.d:0 "那他最后通牒之前发了什么"
 ROM.3.a:0 "我们绝不屈服！"
 ROM.3.b:0 "我们打不过他们..."
 ROM.4.t:0 "摩尔多瓦王国问题"
 ROM.4.d:0 "占位符"
 ROM.4.a:0 "是时候统一了"
 ROM_a_desc: "§R若果他们拒绝，我们将不得不采取强硬手段§!"