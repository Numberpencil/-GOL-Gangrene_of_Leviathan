l_simp_chinese:
 economy: "经济法案"
 civilian_economy: "民用经济" 
 civilian_economy_desc: "“只有市场经济才能实现繁荣和自由”- 米尔顿·弗里德曼"
 low_economic_mobilisation: "前期动员"
 low_economic_mobilisation_desc: "“我们赖以生存的经济社会之所以会存在突出的问题，一方面是由于不能提供充分就业，另一方面则是因为武断而又不公平的财富和收入的分配”- 约翰·梅纳德·凯恩斯"
 partial_economic_mobilisation: "部分动员"
 partial_economic_mobilisation_desc: "“你们马上就要踏上征程去进行一场伟大的圣战，为此我们已精心准备了数月……我对你们的勇敢、责任心和作战技巧充满了信心，我们迎接的只会是彻底的胜利”- 德怀特·艾森豪威尔"
 war_economy: "战争动员"
 war_economy_desc: "“你们不会全都牺牲。每次战斗下来，你们当中可能会牺牲百分之二。不要怕，每个人终究会死……真正的英雄，是即使胆怯仍旧坚持作战的男子汉”- 乔治·巴顿"
 tot_economic_mobilisation: "总动员"
 tot_economic_mobilisation_desc: "“一个哪怕只有最微小的好战倾向的个人，也会发现自己难以拒绝国家为自己提供的枪械，因为在他的头脑中另一种出路的可能性已不复存在。”-恩斯特·荣格尔《总动员》"
 mobilization_laws: "征兵法案"
 disarmed_nation: "去军事化国家"
 Training_the_military_is_prohibited: "§R禁止训练军队§!"
 disarmed_nation_desc: "“无论人与人还是国与国之间，尊重他人权利才能带来和平”- 贝尼托.华雷斯"
 volunteer_only: "志愿兵役"
 volunteer_only_desc: "“没有军队的外交，好比是没有乐器的音乐”- 腓特烈二世"
 limited_conscription: "有限征兵"
 limited_conscription_desc: "“狮子率领的羊群战斗力远胜于绵羊率领的狮群”- 亚历山大大帝"
 extensive_conscription: "广泛征兵"
 extensive_conscription_desc: "兵民是胜利之本-毛泽东"
 service_by_requirement: "按需求征兵"
 service_by_requirement_desc: "“征兵是一个国家的生命力，是其道德的净化，也是其所有习惯的真正基础”- 拿破仑.波拿巴"
 all_adults_serve: "所有成人服兵役"
 all_adults_serve_desc: "“一个拥有不受控制的军事征兵权的自由政府，是最荒谬和可憎的矛盾和胡言乱语”- 佚名"
 scraping_the_barrel: "穷途末路"
 scraping_the_barrel_desc: "“我认为征兵原则是对我们所有珍视的个人自由、民主自由和基督教教义理想的彻底否定”- 罗杰.纳什.鲍德温"
 trade_laws: "贸易法案"
 free_trade: "自由贸易"
 free_trade_desc: "“如果外国能以比我们自己制造还便宜的商品供应我们，我们最好就用我们有利地使用自己的产业生产出来的物品的一部分向他们购买”- 亚当·斯密"
 export_focus: "重视出口"
 export_focus_desc: "“增加我们财富和金银的普遍方法是对外贸易，因此我们必须遵循一项规则：每年卖给外国人的商品价值，必须超过我们消费他们的商品价值”- 托马斯·孟"
 limited_exports: "有限出口"
 limited_exports_desc: "“一个国家的真正利益不在于追求贸易顺差，而在于通过平衡的贸易实现产业的相互繁荣”- 大卫·休谟"
 closed_economy: "封闭经济"
 closed_economy_desc: "“国家最重要的制造业，应当通过关税手段加以保护，即使短期内成本更高……直到它能独立应对外国竞争”- 亚历山大·汉密尔顿"
 Industrial_Policy: "工业政策"
 Laissez_faire_policy: "自由放任政策"
 Laissez_faire_policy_desc: "“普遍自由地建立工厂的权利，与个人的自由发展有着最紧密的联系。”- 约翰·斯图尔特·密尔-《政治经济学原理》"
 Limited_intervention_policy: "有限干预政策"
 Limited_intervention_policy_desc: "“政府最必要的职责，就是保护那些无法保护自己的人。”- 亚伯拉罕·林肯"
 National_coordination_policy: "国家统筹政策"
 National_coordination_policy_desc: "“国家不应该只是夜间更夫。”- 约瑟夫·张伯伦"
 Government_led_policies: "政府主导政策"
 Government_led_policies_desc: "“我们想要的是国家资本主义……这完全符合纲领所指出的方向。”- 米哈伊尔·加里宁"
 Wartime_Industrial_Policy: "战时工业政策"
 Wartime_Industrial_Policy_desc: "“没有一个政府可以仰赖独裁者的善意来获取最基本的战略物资。”——温斯顿·丘吉尔"
 Total_military_control_industry: "全面军事管制工业"
 Total_military_control_industry_desc: "“当整个国家全面转向战争的轨道后，一切个人的生活都丧失了意义。”- 埃里希·鲁登道夫"
 Science_Policy: "科技政策"
 Conservative_tendencies_in_scientific_research: "科研保守倾向"
 Conservative_tendencies_in_scientific_research_desc: "“没有良知的科学不过是灵魂的毁灭。”- 弗朗索瓦·拉伯雷《巨人传》"
 Basic_scientific: "基本科研主导"
 Basic_scientific_desc: "“在我们这个时代，每一种事物好像都包含有自己的反面。……技术的胜利，似乎是以道德的败坏为代价换来的。”- 卡尔·马克思"
 Relaxing_scientific: "放宽科研管控"
 Relaxing_scientific_desc: "“作为科学家，我们知道伟大的进展都源于承认无知，源于思想的自由。”- 理查德·费曼"
 No_scientific_research_control: "无科研管控"
 No_scientific_research_control_desc: "“人们能够把已经做出来的发现的应用组织起来，但是不能把发现本身组织起来。只有自由的个人才能够做出发现。”- 阿尔伯特·爱因斯坦"
 Moral_vacuum_research: "道德真空科研"
 Moral_vacuum_research_desc: "“我们绝不能把传统道德看得太重。”-《代达罗斯，或科学与未来》- J.B.S. 霍尔丹"
 Megastructure_research: "巨构主义科研"
 Megastructure_research_desc: "“非常明显，技术已经超越我们的人性。” —— 阿尔伯特·爱因斯坦"
 Military_training: "军事训练"
 No_training_system: "无训练体系"
 No_training_system_desc: "勇气很少与生俱来，多数情况下需要通过严格的训练和铁一般的纪律来约束铸就。” —— 韦格蒂乌斯"
 Relaxed_training_system: "宽松训练体系"
 Relaxed_training_system_desc: "“我们不会提升到我们期望的高度，而是会下降到我们训练的水平。” —— 查尼洛斯"
 Basic_training_system: "基本训练体系"
 Basic_training_system_desc: "“战术上的熟练是战略上胜利的基石，而熟练唯一的途径就是反复训练。” —— 欧文·隆美尔"
 Professional_training_system: "专业训练体系"
 Professional_training_system_desc: "凡受过良好训练的军人都渴望战斗，而没有经过训练的军人则惧怕作战。” —— 韦格蒂乌斯"
 Rigorous_training_system: "严酷训练体系"
 Rigorous_training_system_desc: "“一品脱汗水能够省下一加仑鲜血。” —— 乔治·S·巴顿"
 Public_Security_System: "治安制度"
 No_public_security_agency: "无治安机构"
 No_public_security_agency_desc: "“自由意味着责任，这就是为什么大多数人惧怕自由”- 萧伯纳"
 Preventative_security: "预防性治安"
 Preventative_security_desc: "“管得最少的政府是最好的政府”- 托马斯.潘恩"
 Standard_security: "标准治安保障"
 Standard_security_desc: "“政府不能解决问题，政府本身就是问题”- 罗纳德.里根"
 Medium_sized_law_enforcement_agencies: "中等规模治安机构"
 Medium_sized_law_enforcement_agencies_desc: "“一切适度的东西都是好的。”- 亚里士多德"
 Large_scale_law_enforcement_agencies: "大规模治安机构"
 Large_scale_law_enforcement_agencies_desc: "“法律必须像死亡一样，对所有人一视同仁。”- 孟德斯鸠"
 Severe_social_control: "重度社会管控"
 Severe_social_control_desc: "“权力导致腐败，绝对权力导致绝对腐败。”- 阿克顿勋爵"
 Nowhere_to_hide: "全景监狱"
 Nowhere_to_hide_desc: "“老大哥在看着你——”- 乔治·奥威尔《1984》"
 Women_rights: "妇女权利"
 Women_are_subordinate: "女性受支配"
 Women_are_subordinate_desc: "“大自然把女性造就成弱者，目的是为了让她们依赖男性，并承受男性的统治。她们不应当拥有政治权利。”—— 让-雅克·卢梭"
 Traditional_gender_roles: "传统性别角色"
 Traditional_gender_roles_desc: "“女人不是天生的，而是被塑造成的。” — 西蒙·德·波伏瓦"
 Women_equal_rights: "女性平等权利"
 Women_equal_rights_desc: "“我不是任何人的另一半，我就是我自己的全部。” — 露意莎·奥尔科特"
 higher_status_of_women: "较高女性地位"
 higher_status_of_women_desc: "“人权就是妇女的权利，妇女的权利就是人权。” — 希拉里·克林顿"
 Cultural_Policy: "文化政策"
 religious_theocracy: "宗教神权"
 religious_theocracy_desc: "“在神权统治下，怀疑是最大的罪名，因为思考是对神的背叛。”—— 伏尔泰"
 Maintaining_tradition: "维护传统"
 Maintaining_tradition_desc: "“求木之长者，必固其根本；欲流之远者，必浚其泉源。” —— 魏征"
 The_Doctrine_of_the_Mean: "中庸之道"
 The_Doctrine_of_the_Mean_desc: "“传统不是对灰烬的膜拜，而是对火种的传递。” —— 古斯塔夫·马勒"
 Cultural_freedom: "文化自由"
 Cultural_freedom_desc: "“政府在文化政策中的职责不是去定义什么是艺术，而是去为艺术的成长提供肥沃的土壤。” —— 约翰·肯尼迪"
 Complete_liberation: "完全解放"
 Complete_liberation_desc: "“好的文化政策不仅是保护过去，更是为未来创造一个自由表达和创新的环境。” —— 瓦茨拉夫·哈维尔"
 Education_Policy: "教育政策"
 No_education_system: "无教育体系"
 No_education_system_desc: "玉不琢，不成器；人不学，不知道。——《礼记·学记》"
 Preliminary_Education_System: "初步教育体系"
 Preliminary_Education_System_desc: "“教育不是灌输，而是点燃火焰。”—— 苏格拉底"
 private_education_system: "私立教育体系"
 private_education_system_desc: "“教育就是一棵树摇动一棵树，一朵云推动一朵云，一个灵魂唤醒另一个灵魂。”"
 Basic_compulsory_education_system: "基本义务教育体系"
 Basic_compulsory_education_system_desc: "“一个开明的政府，其教育政策不仅要培养卓越的精英，更要托举起社会的底层。”"
 Higher_compulsory_education_system: "高等义务教育体系"
 Higher_compulsory_education_system_desc: "“在所有公共支出中，教育绝非一种消费，而是回报率最高的长远投资。”"
 public_higher_education_system: "公立高等教育体系"
 public_higher_education_system_desc: "“宁可少建一座监狱，也要多建一所学校。” —— 维克多·雨果"
 Labor_Policy: "劳工政策"
 slave_treatment: "会说话的工具"
 slave_treatment_desc: "“世界上的一半人必须流汗呻吟，以便另一半人享受美梦。”- 朗费罗"
 Minimum_Labor_Protection: "最低劳动保障"
 Minimum_Labor_Protection_desc: "“一个依靠支付低于生活工资来维持生存的企业，没有权利在这个国家继续存在。”- 富兰克林·D·罗斯福"
 Limited_labor_protection: "有限劳动保障"
 Limited_labor_protection_desc: "“工作，你才有生存的权利；工作，你才能完善你的身心；工作，你才能分享共同的完美。”- 赖伯曼"
 Appropriate_labor_protection: "适当劳动保障"
 Appropriate_labor_protection_desc: "“相信，无论体力劳动还是脑力劳动都是高尚的；世界不会让人不劳而获，而会给人一次谋生的机会。”- 约翰·D·洛克菲勒"
 Workers_Country: "工人之国"
 Workers_Country_desc: "“未来将属于两种人：思想的人和劳动的人。实际上，这两种人是一种人，因为思想也是劳动”- 维克多·雨果"
 welfare_policies: "福利政策"
 Living_like_dregs: "如渣滓般苟活"
 Living_like_dregs_desc: "“福利政策的危险在于，它用官僚机构的家长式照顾，取代了个人责任感。” —— 米尔顿·弗里德曼"
 Minimum_Social_Security: "最低社会保障"
 Minimum_Social_Security_desc: "“社会保障制度应当是社会的稳定器，而非政府的财政包袱。” —— 威廉·贝弗里奇"
 Basic_social_security: "基本社会保障"
 Basic_social_security_desc: "“一个社会的文明程度，不仅体现在它如何对待精英，更体现在它如何对待弱者。” —— 丘吉尔"
 High_social_security: "高昂社会保障"
 High_social_security_desc: "“任何政策都绝对会有负面影响，没有完美的解决方案，只有利益的权衡。” —— 托马斯·索维尔"
 welfare_state: "福利国家"
 welfare_state_desc: "“福利国家的本质是消除人们对生老病死的恐惧，让每个人都有尊严地生活。” —— 庇古"
